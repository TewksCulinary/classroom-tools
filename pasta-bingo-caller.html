<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasta Bingo Caller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: top control bar, one big picture stage, called-list panel on the right. */
  --bg: #eceff2;
  --panel: #ffffff;
  --card: #f5f2ed;      /* matches the photo background on the calling cards */
  --ink: #1b2129;
  --muted: #5a6573;
  --line: #cdd3da;
  --accent: #b3261e;
  --accent-ink: #ffffff;
  --font: 'Lexend', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --panel: #1b2129; --ink: #eef1f4; --muted: #a4afbc; --line: #35404c; --accent: #ff7468; --accent-ink: #1a0a08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --panel: #1b2129; --ink: #eef1f4; --muted: #a4afbc; --line: #35404c; --accent: #ff7468; --accent-ink: #1a0a08;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---- top bar ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; margin-right: auto; text-wrap: balance; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.count b { color: var(--ink); font-size: 1.1rem; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: .9rem; font-weight: 500; }
.btn:hover { border-color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.warn { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---- main ---- */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px 20px 20px; }
.main.with-list { grid-template-columns: minmax(0, 1fr) minmax(230px, 310px); }
.stage { min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.pic { flex: 1; min-height: 0; background: var(--card); border: 2px solid var(--line); border-radius: 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pic img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.pic img.fade { animation: in .35s ease-out; }
@keyframes in { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pic img.fade { animation: none; } }
.ready { text-align: center; padding: 24px; color: #4a4a48; }
.ready strong { display: block; font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 700; margin-bottom: 8px; color: #1b2129; }
.ready span { font-size: clamp(1rem, 1.8vw, 1.3rem); }
.name { min-height: 1.2em; text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(1.8rem, 6vw, 4.2rem); line-height: 1.1; text-wrap: balance; }
.name.hidden-name { color: var(--muted); font-weight: 500; font-size: clamp(1.1rem, 2.4vw, 1.6rem); letter-spacing: .02em; text-transform: none; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; align-items: center; }
.next { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 16px 44px; font-size: clamp(1.1rem, 2.2vw, 1.5rem); font-weight: 700; cursor: pointer; }
.next:hover { filter: brightness(1.08); }
.back { padding: 14px 18px; border-radius: 14px; }
.hint { text-align: center; color: var(--muted); font-size: .82rem; margin: 0; }
.status { text-align: center; color: var(--muted); font-size: .85rem; min-height: 1.2em; margin: 0; }

/* ---- called list ---- */
.list { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list h2 { margin: 0; padding: 12px 14px; font-size: .95rem; font-weight: 700; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.list h2 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.grid { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; align-content: start; }
.item { background: var(--card); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.item.latest { border-color: var(--accent); }
.item img { width: 100%; display: block; aspect-ratio: 506 / 343; object-fit: cover; }
.item div { padding: 3px 4px 4px; font-size: .66rem; font-weight: 700; text-transform: uppercase; text-align: center; color: #1b2129; letter-spacing: .02em; overflow-wrap: anywhere; }
.empty { grid-column: 1 / -1; color: var(--muted); font-size: .9rem; padding: 6px 4px; }

@media (max-width: 820px) {
  .main.with-list { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 200px; }
  .bar { padding: 10px 16px; }
  .main { padding: 12px 16px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>Pasta Bingo Caller</h1>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="tools">
      <button class="btn" id="btnNames" type="button" aria-pressed="true">Show name</button>
      <button class="btn" id="btnList" type="button" aria-pressed="true">Called list</button>
      <button class="btn" id="btnFull" type="button">Full screen</button>
      <button class="btn warn" id="btnNew" type="button">New game</button>
    </div>
  </header>

  <div class="main with-list" id="main">
    <section class="stage" aria-label="Current pasta">
      <div class="pic" id="pic"></div>
      <div class="name" id="name" aria-live="polite"></div>
      <div class="actions">
        <button class="btn back" id="btnBack" type="button">Back</button>
        <button class="next" id="btnNext" type="button">Call next pasta</button>
      </div>
      <p class="status" id="status"></p>
      <p class="hint">Space, Enter or the right arrow calls the next pasta. Left arrow goes back one.</p>
    </section>

    <aside class="list" id="list" aria-label="Pastas called so far">
      <h2>Called so far <span id="listCount"></span></h2>
      <div class="grid" id="grid"></div>
    </aside>
  </div>
</div>

const KEY = 'pasta-bingo-caller-v1';
const $ = (id) => document.getElementById(id);
const el = { pic: $('pic'), name: $('name'), count: $('count'), grid: $('grid'), listCount: $('listCount'), main: $('main'), list: $('list'),
  next: $('btnNext'), back: $('btnBack'), names: $('btnNames'), listBtn: $('btnList'), full: $('btnFull'), newGame: $('btnNew'), status: $('status') };

let order = [];      // shuffled deck of card indexes
let called = 0;      // how many have been called
let showName = true, showList = true;
let confirmReset = false, confirmTimer = null;

function shuffle(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function save() { try { sessionStorage.setItem(KEY, JSON.stringify({ order, called, showName, showList })); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(sessionStorage.getItem(KEY) || 'null');
    if (s && Array.isArray(s.order) && s.order.length === CARDS.length && Number.isInteger(s.called) && s.called >= 0 && s.called <= CARDS.length) {
      order = s.order; called = s.called; showName = s.showName !== false; showList = s.showList !== false; return;
    }
  } catch (e) {}
  order = shuffle(CARDS.length); called = 0;
}

let lastShown = -1;
function render(animate) {
  const total = CARDS.length;
  el.count.innerHTML = '<b>' + called + '</b> of ' + total + ' called';
  el.listCount.textContent = called + '/' + total;

  // stage
  const idx = called > 0 ? order[called - 1] : -1;
  el.pic.textContent = '';
  if (idx >= 0) {
    const img = document.createElement('img');
    img.src = CARDS[idx].src; img.alt = CARDS[idx].name;
    if (animate) img.className = 'fade';
    el.pic.appendChild(img);
    el.name.textContent = showName ? CARDS[idx].name : 'Name hidden';
    el.name.className = 'name' + (showName ? '' : ' hidden-name');
  } else {
    const d = document.createElement('div'); d.className = 'ready';
    d.innerHTML = '<strong>' + total + ' pastas shuffled</strong><span>Press &ldquo;Call next pasta&rdquo; to show the first picture.</span>';
    el.pic.appendChild(d);
    el.name.textContent = ''; el.name.className = 'name';
  }

  // buttons
  const done = called >= total;
  el.next.textContent = done ? 'Start a new game' : (called === 0 ? 'Call first pasta' : 'Call next pasta');
  el.back.disabled = called === 0;
  el.names.setAttribute('aria-pressed', String(showName));
  el.listBtn.setAttribute('aria-pressed', String(showList));
  el.main.classList.toggle('with-list', showList);
  el.list.hidden = !showList;
  el.newGame.textContent = confirmReset ? 'Click again to confirm' : 'New game';
  el.status.textContent = done ? 'That is all ' + total + ' pastas. Every card has been called.' : (el.status.dataset.note || '');

  // called list, newest first
  el.grid.textContent = '';
  if (called === 0) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing called yet.'; el.grid.appendChild(e);
  } else {
    for (let k = called - 1; k >= 0; k--) {
      const c = CARDS[order[k]];
      const it = document.createElement('div'); it.className = 'item' + (k === called - 1 ? ' latest' : '');
      const im = document.createElement('img'); im.src = c.src; im.alt = '';
      const nm = document.createElement('div'); nm.textContent = c.name;
      it.append(im, nm); el.grid.appendChild(it);
    }
  }
  save();
}

function setNote(t) { el.status.dataset.note = t || ''; el.status.textContent = t || ''; }
function callNext() {
  cancelReset(); setNote('');
  if (called >= CARDS.length) { newGame(); return; }
  called++; render(true);
}
function goBack() { cancelReset(); setNote(''); if (called > 0) { called--; render(true); } }
function newGame() { order = shuffle(CARDS.length); called = 0; cancelReset(); setNote(''); render(false); }
function cancelReset() { confirmReset = false; clearTimeout(confirmTimer); }
function askReset() {
  if (called === 0 || called >= CARDS.length) { newGame(); return; }
  if (!confirmReset) { confirmReset = true; render(false); confirmTimer = setTimeout(() => { confirmReset = false; render(false); }, 4000); }
  else newGame();
}
async function goFull() {
  try {
    if (document.fullscreenElement) { await document.exitFullscreen(); return; }
    await document.documentElement.requestFullscreen();
  } catch (e) { setNote('Full screen is blocked in this view. Press F11, or open this page in its own browser tab first.'); }
}

el.next.addEventListener('click', () => { callNext(); el.next.blur(); });
el.back.addEventListener('click', () => { goBack(); el.back.blur(); });
el.names.addEventListener('click', () => { showName = !showName; render(false); el.names.blur(); });
el.listBtn.addEventListener('click', () => { showList = !showList; render(false); el.listBtn.blur(); });
el.full.addEventListener('click', () => { goFull(); el.full.blur(); });
el.newGame.addEventListener('click', () => { askReset(); el.newGame.blur(); });
document.addEventListener('keydown', (e) => {
  const t = e.target && e.target.tagName;
  if (t === 'BUTTON' || t === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); callNext(); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); goBack(); }
});

load(); render(false);
</script>
