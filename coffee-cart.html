<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Cart Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B1D14;
    --ground: #FAF6F0;
    --line: #D9CBB8;
    --muted: #5A4A3D;
    --go: #1F6F5C;
    --pick: #FFE3A3;
    --panel: #F1E7D8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Lexend, system-ui, sans-serif; background: var(--ground); color: var(--ink); }
  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--go); outline-offset: 3px; }

  #app { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 26vw, 340px); height: 100vh; }
  #app > * { overflow-y: auto; }
  #main { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  #ticket { background: var(--panel); border-left: 4px solid var(--ink); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
  #queue { background: #fff; border-left: 4px solid var(--ink); padding: 28px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* two screens: order (default) and queue (?screen=queue) */
  .mode-order #queue { display: none; }
  .mode-queue #app { grid-template-columns: minmax(0, 1fr); }
  .mode-queue #main, .mode-queue #ticket { display: none; }
  .mode-queue #queue { border-left: none; padding: 24px 28px; }
  .qhead { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .mode-queue .qcard .name { font-size: 34px; }
  .mode-queue .qcard .items { font-size: 22px; }
  .newtag { background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
  .banner { border: 4px solid var(--ink); border-radius: 14px; background: var(--pick); padding: 10px 14px; font-size: 19px; line-height: 1.35; display: flex; flex-direction: column; gap: 8px; }
  .status-ok { font-size: 18px; color: var(--muted); }
  #overlay[hidden] { display: none; }
  #overlay { position: fixed; inset: 0; background: rgba(43, 29, 20, 0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: #fff; border: 4px solid var(--ink); border-radius: 20px; padding: 24px; max-width: 640px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }

  h1 { margin: 0; font-size: 42px; line-height: 1.1; font-weight: 700; }
  h2 { margin: 0; font-size: 26px; font-weight: 700; }
  .side-title { font-size: 30px; font-weight: 700; }
  .muted { color: var(--muted); }

  .crumbs { display: flex; gap: 10px; }
  .crumb { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; padding: 12px 8px; border-radius: 999px; font-size: 20px; font-weight: 600; border: 3px solid var(--line); background: #fff; color: #6B5A4C; }
  .crumb.active { border-color: var(--ink); background: var(--ink); color: #fff; }
  .crumb.done { border-color: var(--go); background: #D6EBE1; color: #12372C; }

  .drinks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .drink { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 200px; padding: 16px 10px; border-radius: 20px; border: 4px solid var(--line); background: #fff; color: var(--ink); font-size: 24px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
  .drink:hover { border-color: var(--ink); }

  .grid { display: grid; gap: 14px; }
  .tile { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 80px; padding: 12px 18px; border-radius: 18px; font-size: 23px; font-weight: 600; line-height: 1.15; text-align: left; cursor: pointer; color: var(--ink); border: 4px solid var(--line); background: #fff; }
  .tile.on { border-color: var(--ink); background: var(--pick); }
  .tile.big { min-height: 88px; font-size: 28px; }
  .tile small { display: block; margin-top: 4px; font-size: 0.72em; font-weight: 400; color: var(--muted); }
  .tile svg { flex: none; }

  .chip { font-size: 22px; font-weight: 600; padding: 6px 16px; border-radius: 999px; background: var(--pick); border: 3px solid var(--ink); }
  .section-label { font-size: 26px; font-weight: 700; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 8px 4px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .scroll > * { flex: none; } /* keep items at full size so the area scrolls instead of squashing them */

  .primary, .secondary { min-height: 72px; padding: 0 40px; border-radius: 18px; font-size: 26px; cursor: pointer; }
  .primary { border: none; background: var(--go); color: #fff; font-weight: 700; }
  .primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .secondary { border: 4px solid var(--ink); background: #fff; color: var(--ink); font-weight: 600; padding: 0 36px; }
  .small { align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 600; cursor: pointer; }
  .clear { min-height: 56px; padding: 0 20px; border-radius: 14px; border: 3px solid var(--ink); background: transparent; color: var(--ink); font-size: 20px; font-weight: 600; cursor: pointer; }

  .field-label { font-size: 24px; font-weight: 600; }
  .text-input { height: 76px; width: 100%; padding: 0 24px; font-size: 34px; font-weight: 600; border-radius: 18px; border: 4px solid var(--ink); background: #fff; color: var(--ink); }
  .text-input.notes { font-size: 30px; }
  .text-input.mid { height: 64px; font-size: 24px; padding: 0 16px; }

  .tcard { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .t-title { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .t-detail { font-size: 20px; line-height: 1.35; }
  .making { background: var(--pick); border: 3px dashed var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .making .k { font-weight: 700; }
  .making .head { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
  .spacer { flex: 1; }

  .badge { min-width: 44px; text-align: center; padding: 6px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 24px; font-weight: 700; }
  .qcard { border: 4px solid var(--ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: #FFF8E6; }
  .qcard .name { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .qcard .items { font-size: 20px; line-height: 1.4; white-space: pre-line; }
  .qcard .finish { min-height: 60px; margin-top: 4px; border-radius: 14px; border: none; background: var(--go); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; }
  .fin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 20px; color: var(--muted); }

  .labels { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; flex: 1; min-height: 0; overflow-y: auto; }
  .label { width: 320px; padding: 18px 20px; border: 3px dashed var(--ink); border-radius: 14px; background: #fff; display: flex; flex-direction: column; gap: 6px; }

  /* punch cards */
  .teacher-list { padding: 4px; }
  .notice { border: 4px solid var(--ink); border-radius: 16px; padding: 14px 18px; background: var(--pick); font-size: 22px; font-weight: 600; line-height: 1.35; }
  .info { font-size: 22px; line-height: 1.4; padding: 12px 16px; border-radius: 14px; background: #fff; border: 3px solid var(--line); }
  .panel { background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .form-row > div { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 150px; }
  .form-row label { font-size: 18px; font-weight: 600; }
  .trow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 2px solid var(--line); font-size: 22px; }
  .trow:last-child { border-bottom: none; }
  .trow .bal { font-weight: 700; min-width: 70px; text-align: right; }
  .logrow { font-size: 18px; display: flex; gap: 10px; padding: 4px 0; }
  .logrow .when { color: var(--muted); min-width: 120px; }

  /* smaller screens: keep the ticket and queue on the side, just make everything a bit tighter */
  @media (max-width: 1200px) {
    #main { padding: 20px 20px; gap: 14px; }
    #ticket { padding: 20px 14px; }
    #queue { padding: 20px 14px; }
    h1 { font-size: 34px; }
    .side-title { font-size: 26px; }
    .drinks { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .drink { min-height: 150px; font-size: 21px; }
    .drink svg { width: 64px; height: 64px; }
    .tile { font-size: 20px; padding: 10px 14px; min-height: 68px; }
    .tile.big { font-size: 24px; min-height: 76px; }
    .crumbs { gap: 6px; }
    .crumb { font-size: 16px; padding: 10px 4px; }
    .primary, .secondary { font-size: 22px; padding: 0 24px; min-height: 64px; }
    .text-input { font-size: 28px; height: 68px; }
    .qcard .name { font-size: 26px; }
    .t-title { font-size: 21px; }
    .t-detail, .qcard .items { font-size: 18px; }
    .label { width: 100%; }
  }
  /* short windows (small laptops): tighten spacing so more fits */
  @media (max-height: 760px) {
    #main { padding: 14px 20px; gap: 10px; }
    #ticket, #queue { padding: 14px; }
    h1 { font-size: 30px; }
    .crumb { padding: 8px 4px; font-size: 16px; }
    .tile { min-height: 58px; font-size: 20px; padding: 8px 14px; }
    .tile.big { min-height: 64px; font-size: 22px; }
    .text-input { height: 58px; font-size: 26px; }
    .text-input.mid { height: 52px; font-size: 20px; }
    .primary, .secondary { min-height: 56px; font-size: 20px; padding: 0 22px; }
    .drink { min-height: 128px; }
    .drink svg { width: 56px; height: 56px; }
  }
  /* very narrow windows only (phones): stack */
  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; height: auto; }
    #app > * { overflow-y: visible; }
    #ticket, #queue { border-left: none; border-top: 4px solid var(--ink); }
    .drinks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media print { #ticket, #queue, .crumbs, .row, .primary { display: none !important; } }
</style>
</head>
<body>
<div id="app">
  <main id="main" aria-live="polite"></main>
  <aside id="ticket" aria-label="Order ticket"></aside>
  <aside id="queue" aria-label="Order queue"></aside>
</div>
<div id="overlay" hidden></div>

<script>
var CartLogic = (function () {
  'use strict';
  // Shared rules for the coffee cart. The SAME code runs in the browser (test mode on one
  // computer) and in the Apps Script (real mode with a Google Sheet), so both behave alike.
  //
  // db = { orders: [], teachers: [{id,name,punches}], ledger: [], cards: [], pinHash: '', nextTid: 1 }
  // handle(db, req, now, day) -> { resp, changes }
  //   resp    = JSON sent back to the page
  //   changes = what the Apps Script must write to the Sheet (the browser version just saves db)

  function newDb() {
    return { orders: [], teachers: [], ledger: [], cards: [], pinHash: '', nextTid: 1 };
  }
  function fail(code, message) {
    return { resp: { ok: false, error: code, message: message }, changes: null };
  }
  function emptyChanges() {
    return { ordersAdded: [], ordersUpdated: [], teachersAdded: [], teachersUpdated: [], ledgerAdded: [], cardsAdded: [], pinHash: null };
  }
  function lower(s) { return String(s).toLowerCase(); }
  function intOr(v, dflt) {
    var n = parseInt(v, 10);
    return isNaN(n) ? dflt : n;
  }
  function teacherById(db, id) {
    for (var i = 0; i < db.teachers.length; i++) if (db.teachers[i].id === id) return db.teachers[i];
    return null;
  }
  function plural(n, word) {
    var many = word === 'punch' ? 'punches' : word + 's';
    return n + ' ' + (Math.abs(n) === 1 ? word : many);
  }

  function snapshot(db, now, day) {
    var cutoff = now - 3 * 3600 * 1000;
    var orders = db.orders.filter(function (o) { return !o.done || (o.doneAt || 0) >= cutoff; });
    orders.sort(function (a, b) { return a.createdAt - b.createdAt; });
    if (orders.length > 80) orders = orders.slice(orders.length - 80);
    return {
      ok: true,
      serverNow: now,
      today: day,
      orders: orders,
      teachers: db.teachers.map(function (t) { return { id: t.id, name: t.name, punches: t.punches }; }),
      hasPin: !!db.pinHash,
      log: db.ledger.slice(-15).reverse()
    };
  }

  // for the punch-card page: teachers and recent activity only, no orders
  function punchSnapshot(db, now) {
    return {
      ok: true,
      serverNow: now,
      teachers: db.teachers.map(function (t) { return { id: t.id, name: t.name, punches: t.punches }; }),
      hasPin: !!db.pinHash,
      log: db.ledger.slice(-40).reverse()
    };
  }

  function addOrder(db, o, now, day) {
    if (!o.id) return fail('bad-order', 'The order has no id.');
    for (var i = 0; i < db.orders.length; i++) {
      if (db.orders[i].id === o.id) return { resp: { ok: true, order: db.orders[i], duplicate: true }, changes: null };
    }
    if (!o.items || !o.items.length) return fail('empty', 'There are no drinks in this order.');
    // an order can be for a later day (teacher orders); numbers count up within the day it is FOR
    var forDate = /^\d{4}-\d{2}-\d{2}$/.test(String(o.forDate || '')) && o.forDate >= day ? o.forDate : day;
    var num = 0;
    db.orders.forEach(function (x) { if ((x.forDate || x.day) === forDate && x.num > num) num = x.num; });
    var order = {
      id: String(o.id).slice(0, 60),
      num: num + 1,
      day: day,
      forDate: forDate,
      source: o.source === 'form' ? 'form' : '',
      createdAt: now,
      name: String(o.name || '').slice(0, 60),
      method: o.method === 'delivery' ? 'delivery' : 'pickup',
      room: String(o.room || '').slice(0, 20),
      items: o.items.slice(0, 20).map(function (it) {
        return { title: String(it.title || '').slice(0, 60), detail: String(it.detail || '').slice(0, 300) };
      }),
      pay: o.pay === 'punch' ? 'punch' : 'other',
      teacherId: null,
      teacherName: '',
      balanceAfter: null,
      done: false,
      doneAt: null
    };
    var ch = emptyChanges();
    if (order.pay === 'punch') {
      var t = o.teacherId !== null && o.teacherId !== undefined && o.teacherId !== '' ? teacherById(db, o.teacherId) : null;
      if (!t && o.teacherName) {
        var want = lower(String(o.teacherName).trim());
        for (var k = 0; k < db.teachers.length; k++) if (lower(db.teachers[k].name) === want) { t = db.teachers[k]; break; }
      }
      if (!t && order.source === 'form') {
        // a teacher order whose name is no longer on the list: still make the drink, but do not use a punch
        order.pay = 'other';
        var first = order.items[0];
        first.detail = (first.detail ? first.detail + ' \u00B7 ' : '') + 'Wanted to pay by punch card, but the name was not found';
      } else if (!t) return fail('no-teacher', 'That teacher is not on the list.');
    }
    if (order.pay === 'punch') {
      var n = order.items.length;
      t.punches -= n; // one punch per drink; going below zero is allowed (honor system)
      var entry = { t: now, teacherId: t.id, name: t.name, delta: -n, note: 'Order #' + order.num + ' (' + plural(n, 'drink') + ')' };
      db.ledger.push(entry);
      order.teacherId = t.id;
      order.teacherName = t.name;
      order.balanceAfter = t.punches;
      ch.teachersUpdated.push(t);
      ch.ledgerAdded.push(entry);
    }
    db.orders.push(order);
    ch.ordersAdded.push(order);
    return { resp: { ok: true, order: order }, changes: ch };
  }

  function setDone(db, req, now) {
    for (var i = 0; i < db.orders.length; i++) {
      if (db.orders[i].id === req.id) {
        var o = db.orders[i];
        o.done = !!req.done;
        o.doneAt = o.done ? now : null;
        var ch = emptyChanges();
        ch.ordersUpdated.push(o);
        return { resp: { ok: true, order: o }, changes: ch };
      }
    }
    return fail('not-found', 'That order was not found.');
  }

  function needPin(db, req) {
    if (!db.pinHash) return fail('no-pin', 'Create a teacher PIN first.');
    if (req.pinHash !== db.pinHash) return fail('bad-pin', 'That PIN is not right.');
    return null;
  }

  function setPin(db, req) {
    var nh = String(req.newPinHash || '');
    if (nh.length < 16) return fail('bad-pin', 'The new PIN was not valid.');
    if (db.pinHash && req.pinHash !== db.pinHash) return fail('bad-pin', 'That PIN is not right.');
    db.pinHash = nh;
    var ch = emptyChanges();
    ch.pinHash = nh;
    return { resp: { ok: true }, changes: ch };
  }

  function addTeachers(db, req, now) {
    var names = (req.names || []).map(function (s) { return String(s).trim().slice(0, 60); }).filter(Boolean);
    if (!names.length) return fail('no-names', 'Type at least one name.');
    var start = intOr(req.start, 0);
    if (start < -50 || start > 200) start = 0;
    var ch = emptyChanges();
    var added = 0, skipped = 0;
    names.forEach(function (name) {
      var dupe = db.teachers.some(function (t) { return lower(t.name) === lower(name); });
      if (dupe) { skipped++; return; }
      var t = { id: db.nextTid++, name: name, punches: start };
      db.teachers.push(t);
      ch.teachersAdded.push(t);
      if (start !== 0) {
        var e = { t: now, teacherId: t.id, name: t.name, delta: start, note: 'Starting balance' };
        db.ledger.push(e);
        ch.ledgerAdded.push(e);
      }
      added++;
    });
    return { resp: { ok: true, added: added, skipped: skipped }, changes: ch };
  }

  function adjust(db, req, now) {
    var t = teacherById(db, intOr(req.teacherId, -1));
    var delta = intOr(req.delta, 0);
    if (!t) return fail('no-teacher', 'That teacher is not on the list.');
    if (!delta || delta < -50 || delta > 50) return fail('bad-number', 'That number of punches is not allowed.');
    t.punches += delta;
    var e = { t: now, teacherId: t.id, name: t.name, delta: delta, note: String(req.note || 'Adjusted by hand').slice(0, 120) };
    db.ledger.push(e);
    var ch = emptyChanges();
    ch.teachersUpdated.push(t);
    ch.ledgerAdded.push(e);
    return { resp: { ok: true, teacher: t }, changes: ch };
  }

  function loadCard(db, req, now) {
    var t = teacherById(db, intOr(req.teacherId, -1));
    var count = intOr(req.count, 0);
    var cardNo = String(req.cardNo || '').trim().slice(0, 40);
    if (!t) return fail('no-teacher', 'That teacher is not on the list.');
    if (count < 1 || count > 50) return fail('bad-number', 'Punches should be a number from 1 to 50.');
    var ch = emptyChanges();
    if (cardNo) {
      var seen = db.cards.some(function (c) { return lower(c.cardNo) === lower(cardNo); });
      if (seen) return fail('dup-card', 'Card ' + cardNo + ' was already loaded. Nothing was added.');
      var c = { cardNo: cardNo, teacherId: t.id, t: now };
      db.cards.push(c);
      ch.cardsAdded.push(c);
    }
    t.punches += count;
    var e = { t: now, teacherId: t.id, name: t.name, delta: count, note: cardNo ? 'Loaded card ' + cardNo : 'Loaded a card' };
    db.ledger.push(e);
    ch.teachersUpdated.push(t);
    ch.ledgerAdded.push(e);
    return { resp: { ok: true, teacher: t }, changes: ch };
  }

  function handle(db, req, now, day) {
    var a = req && req.action;
    var bad;
    if (a === 'poll') return { resp: snapshot(db, now, day), changes: null };
    if (a === 'punchPoll') return { resp: punchSnapshot(db, now), changes: null };
    if (a === 'addOrder') return addOrder(db, req.order || {}, now, day);
    if (a === 'setDone') return setDone(db, req, now);
    if (a === 'verifyPin') return { resp: { ok: true, valid: !!db.pinHash && req.pinHash === db.pinHash }, changes: null };
    if (a === 'setPin') return setPin(db, req);
    if (a === 'addTeachers' || a === 'adjust' || a === 'loadCard' || a === 'export') {
      bad = needPin(db, req);
      if (bad) return bad;
      if (a === 'addTeachers') return addTeachers(db, req, now);
      if (a === 'adjust') return adjust(db, req, now);
      if (a === 'loadCard') return loadCard(db, req, now);
      return { resp: { ok: true, data: { teachers: db.teachers, ledger: db.ledger, cards: db.cards, orders: db.orders } }, changes: null };
    }
    return fail('unknown-action', 'Unknown request.');
  }

  return { newDb: newDb, handle: handle, snapshot: snapshot };
})();
</script>
<script>
(function () {
  'use strict';

  // ---------- menu data (edit here to change the menu) ----------
  var DRINKS = [
    { id: 'mocha',     name: 'Mocha',              color: '#6B3F2A', steps: ['temp', 'sauce', 'milk', 'flavor'] },
    { id: 'latte',     name: 'Latte',              color: '#B98A5E', steps: ['temp', 'milk', 'flavor'], sauceOnFlavor: true },
    { id: 'americano', name: 'Americano',          color: '#3B2A20', steps: ['temp', 'flavor'], sauceOnFlavor: true },
    { id: 'hotchoc',   name: 'Hot Chocolate',      color: '#8A4B38', steps: ['milk', 'flavor'], sauceOnFlavor: true },
    { id: 'steamer',   name: 'Steamer',            color: '#E6D3B3', steps: ['milk', 'flavor'], sauceOnFlavor: true },

  // ---------- state ----------
  // One file, two screens: the order screen (this page) and the queue screen (add ?screen=queue to the address).
  // Both talk to the coffee cart Google Sheet through an Apps Script web app. With no connection saved the page
  // runs in TEST MODE and keeps everything in this browser, which is handy for trying it on one computer.
  var MODE = /[?&]screen=queue\b/.test(location.search) ? 'queue' : 'order';
  document.body.className = 'mode-' + MODE;
  if (MODE === 'queue') document.title = 'Coffee Cart Queue';
  var CONN_KEY = 'coffeeCartConn.v1', DB_KEY = 'coffeeCartDb.v1', OUTBOX_KEY = 'coffeeCartOutbox.v1', OLD_PUNCH_KEY = 'coffeeCartPunch.v1';
  var POLL_MS = MODE === 'queue' ? 4000 : 10000;
  var state = {
    screen: 'drink', drink: null, step: 0, sel: {}, flavors: [],
    cart: [], name: '', method: null, room: '',
    pay: null, teacherId: null, teacherQuery: '', result: null, focusName: false,
    prevScreen: 'drink', adminUnlocked: false, changingPin: false, adminMsg: '', pinHash: null,
    orders: [], nextId: 1, sending: false, sendError: '',
    connOpen: false, connUrl: '', connCode: '', connMsg: '', connBusy: false, connFocus: false
  };
  var punch = { teachers: [], log: [], hasPin: null };
  var net = { status: 'connecting', skew: 0, polling: false, gen: 0, sig: '', tsig: '', today: '' };
  var overlay = {}, newUntil = {}, firstPoll = true, pointerDown = false;
  var conn = null, outbox = [], flushing = false, storageOk = true;

  function lsGet(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { storageOk = false; return null; }
  }
  function lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { storageOk = false; } }
  function lsDel(key) { try { localStorage.removeItem(key); } catch (e) { storageOk = false; } }
  function pad2(n) { return ('0' + n).slice(-2); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function nowMs() { return Date.now() + net.skew; }
  function copy(x) { return JSON.parse(JSON.stringify(x)); }
  function extend(a, b) { for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) a[k] = b[k]; return a; }

  // ----- test mode: the same rules the Sheet back end uses, but saved in this browser -----
  function loadLocalDb() {
    var db = lsGet(DB_KEY);
    if (db && Array.isArray(db.orders)) return db;
    db = CartLogic.newDb();
    var old = lsGet(OLD_PUNCH_KEY); // bring over punch cards from the earlier one-screen version
    if (old && Array.isArray(old.teachers)) {
      db.teachers = old.teachers.map(function (t) { return { id: t.id, name: t.name, punches: t.punches }; });
      db.nextTid = old.nextTid || (old.teachers.length + 1);
      db.pinHash = old.pinHash || '';
      db.cards = (old.cards || []).map(function (c) { return { cardNo: String(c), teacherId: null, t: 0 }; });
      db.ledger = (old.log || []).slice().reverse().map(function (e) { return { t: e.t, teacherId: null, name: e.name, delta: e.delta, note: e.note }; });
    }
    return db;
  }
  function localCall(req) {
    var db = loadLocalDb();
    var d = new Date();
    var day = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    var r = CartLogic.handle(db, copy(req), Date.now(), day);
    if (r.changes) {
      try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
      catch (e) { storageOk = false; throw new Error('This browser is not letting the page save.'); }
    }
    return copy(r.resp);
  }

  // ----- real mode: the Google Apps Script web app -----
  function remoteCall(url, code, req) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    return fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(extend({ key: code }, req)), signal: ctl ? ctl.signal : undefined
    }).then(function (r) { return r.text(); }).then(function (t) {
      clearTimeout(timer);
      try { return JSON.parse(t); } catch (e) { throw { network: true, why: 'format' }; }
    }, function () { clearTimeout(timer); throw { network: true, why: 'offline' }; });
  }
  function api(req) {
    if (conn) return remoteCall(conn.url, conn.code, req);
    return Promise.resolve().then(function () { return localCall(req); });
  }

  // ----- changes made while offline wait here and are sent when the connection is back -----
  function saveOutbox() { lsSet(OUTBOX_KEY, outbox); }
  function outboxHasDone(id) { return outbox.some(function (x) { return x.kind === 'setDone' && x.id === id; }); }
  function outboxAdd(item) {
    if (item.kind === 'setDone') outbox = outbox.filter(function (x) { return !(x.kind === 'setDone' && x.id === item.id); });
    outbox.push(item); saveOutbox();
  }
  function flushOutbox() {
    if (flushing || !outbox.length) return Promise.resolve();
    flushing = true;
    function step() {
      if (!outbox.length) return Promise.resolve();
      var item = outbox[0];
      var req = item.kind === 'addOrder' ? { action: 'addOrder', order: item.order } : { action: 'setDone', id: item.id, done: item.done };
      return api(req).then(function () {
        outbox.shift(); saveOutbox();
        if (item.kind === 'setDone') overlay[item.id] = { done: item.done, until: Date.now() + 8000 };
        return step();
      }, function (err) {
        if (err && err.network) throw err;
        outbox.shift(); saveOutbox(); // a problem that retrying cannot fix: drop it
        return step();
      });
    }
    return step().catch(function () { /* still offline: try again on the next check */ }).then(function () { flushing = false; });
  }

  function applyPoll(resp) {
    net.skew = resp.serverNow - Date.now();
    net.today = resp.today || '';
    punch.teachers = resp.teachers; punch.log = resp.log; punch.hasPin = resp.hasPin;
    var had = {};
    state.orders.forEach(function (o) { had[o.id] = true; });
    state.orders = resp.orders.map(function (o) {
      var ov = overlay[o.id];
      if (ov && (outboxHasDone(o.id) || ov.until > Date.now())) { o.done = ov.done; if (!ov.done) o.doneAt = null; }
      else if (ov) delete overlay[o.id];
      if (!firstPoll && !had[o.id] && !o.done) newUntil[o.id] = Date.now() + 30000;
      return o;
    });
    firstPoll = false;
    net.status = 'ok';
  }
  // an order for a later day waits until its day
  function isDue(o) { return !o.forDate || !net.today || o.forDate <= net.today; }
  function viewSig() {
    return net.status + '|' + outbox.length + '|' + state.orders.map(function (o) { return o.id + (o.done ? 'd' : 'o'); }).join(',');
  }
  function afterPoll() {
    var sig = viewSig();
    if (MODE === 'queue') { if (sig !== net.sig && !pointerDown) renderQueue(); }
    else {
      if (sig !== net.sig) renderTicket();
      var tsig = JSON.stringify(punch.teachers);
      if (tsig !== net.tsig && state.screen === 'pay') {
        var tl = $('teacherList'); if (tl) tl.innerHTML = teacherListHtml();
        var pi = $('payInfo'); if (pi) pi.innerHTML = payInfoHtml();
      }
      net.tsig = tsig;
    }
    net.sig = sig;
  }
  function pollNow() {
    if (net.polling) return Promise.resolve();
    net.polling = true;
    var gen = net.gen;
    return flushOutbox().then(function () { return api({ action: 'poll' }); }).then(function (resp) {
      net.polling = false;
      if (gen !== net.gen) return;
      if (!resp.ok) { net.status = (resp.error === 'bad-key' || resp.error === 'no-key') ? 'badkey' : 'error'; return; }
      applyPoll(resp);
    }, function (err) {
      net.polling = false;
      if (gen !== net.gen) return;
      net.status = err && err.network ? 'offline' : 'error';
    }).then(function () { if (gen === net.gen) afterPoll(); });
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function val(id) { var el = $(id); return el ? el.value : ''; }
  function drinkObj() { return DRINKS.filter(function (d) { return d.id === state.drink; })[0] || null; }
  function currentKey() { var d = drinkObj(); return d ? d.steps[state.step] : null; }
  function isOptionalSauce() { var d = drinkObj(); return currentKey() === 'sauce' && d.id !== 'mocha'; }
  function teacherById(id) { return punch.teachers.filter(function (t) { return t.id === id; })[0] || null; }
  function byName(a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0; }
  function plural(n, word) {
    var many = word === 'punch' ? 'punches' : word + 's';

  }
  function balanceText(n) {

  function whenText(t) {

  }

  var CHECK = '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#2B1D14"/><path d="M10 18.5l5.5 5.5L26 12.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function cup(color) {
    return '<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><path d="M16 28h40v26a16 16 0 0 1-16 16h-8a16 16 0 0 1-16-16z" fill="' + color + '" stroke="#2B1D14" stroke-width="4" stroke-linejoin="round"/><path d="M56 34h6a8 8 0 0 1 0 16h-6" fill="none" stroke="#2B1D14" stroke-width="4"/><path d="M28 8c-4 4 4 6 0 12M40 8c-4 4 4 6 0 12" fill="none" stroke="#2B1D14" stroke-width="3" stroke-linecap="round"/></svg>';
  }

  function stepReady() {
    var d = drinkObj(); if (!d) return false;

  function canSend() {
    return state.cart.length > 0 && state.name.trim().length > 0 && !!state.method &&

  }
  function canProceed() {
    return state.cart.length > 0 && state.name.trim().length > 0 && !!state.method &&
      (state.method !== 'delivery' || state.room.trim().length > 0);
  }
  function deliveryText(method, room) {

  function payText(o) {

  // PIN: a simple lock to keep students from changing balances (not real security)
  function hashPin(p) {
    var s = 'coffee-cart:' + p;
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');

  function clock(ms) { return new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }

  function statusHtml() {
    var pend = outbox.length ? ' ' + plural(outbox.length, 'change') + ' waiting to send.' : '';

  // ---------- rendering ----------
  function renderCrumbs() {

    else if (state.screen === 'pay') active = labels.length - 1;
    else if (state.screen === 'done') active = labels.length;
    return '<div class="crumbs">' + labels.map(function (l, i) {
      var cls = i < active ? 'done' : i === active ? 'active' : '';
      return '<div class="crumb ' + cls + '">' + (i < active ? '✓ ' : (i + 1) + '  ') + esc(l) + '</div>';
    }).join('') + '</div>';
  }

  function filteredTeachers() {

        '<div class="muted" style="font-size:20px;line-height:1.4">4 to 8 numbers. This PIN keeps students from changing punch balances. It is a simple lock, not a vault.</div>' +
        '<label class="field-label" for="pinNew">New PIN</label><input id="pinNew" class="text-input mid" type="password" inputmode="numeric" autocomplete="off" maxlength="8">' +

    }

    html += msg;
    var teachers = punch.teachers.slice().sort(byName);

      html += '<div class="muted" style="font-size:20px">Add a teacher first (next box).</div>';

        teachers.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + ' (' + esc(balanceText(t.punches)) + ')</option>'; }).join('') + '</select></div>' +
        '<div><label for="loadCardNo">Card number (optional)</label><input id="loadCardNo" class="text-input mid" type="text" autocomplete="off"></div>' +

  function renderTicket() {

  function qcardHtml(o) {

    return '<div class="qcard"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div class="name">' + esc(o.name) + '</div><div style="font-size:22px;font-weight:700">#' + o.num + '</div></div>' +
      ((isNew || o.source === 'form') ? '<div>' + (isNew ? '<span class="newtag">NEW</span> ' : '') + (o.source === 'form' ? '<span class="newtag">TEACHER ORDER</span>' : '') + '</div>' : '') +

      (pay ? '<div style="font-size:18px;font-weight:600">' + esc(pay) + '</div>' : '') +
      '<div class="muted" style="font-size:18px">' + esc(sentText(o)) + '</div>' +
      '<div class="items">' + o.items.map(function (i) { return esc(i.title + (i.detail ? ' — ' + i.detail : '')); }).join('\n') + '</div>' +
      '<button class="finish" data-action="finish" data-v="' + esc(o.id) + '">Mark finished</button></div>';

  function renderQueue() {
    var open = state.orders.filter(function (o) { return !o.done && isDue(o); });
    var later = state.orders.filter(function (o) { return !o.done && !isDue(o); }).length;
    var fin = state.orders.filter(function (o) { return o.done; }).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); }).slice(0, MODE === 'queue' ? 8 : 3);
    var html;
    if (MODE === 'queue') {
      html = '<div class="qhead"><div class="side-title">Coffee Cart Queue</div><div class="badge" aria-label="' + open.length + ' waiting">' + open.length + '</div><div class="spacer"></div>' +
        '<button class="small" data-action="openConn">Connection</button></div>' + statusHtml();
      if (!open.length) html += '<div class="muted" style="font-size:26px;line-height:1.4">No orders waiting.</div>';
      else html += '<div class="qgrid">' + open.map(qcardHtml).join('') + '</div>';
      if (later) html += '<div class="muted" style="font-size:20px">Coming up on later days: ' + plural(later, 'order') + '</div>';
    } else {
      html = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="side-title">Queue</div><div class="badge">' + open.length + '</div></div>';

      html += '<div style="font-size:20px;font-weight:700;margin-top:8px;padding-top:12px;border-top:3px solid var(--line)">Finished</div>' + fin.map(function (o) {

      }).join('');

    $('queue').innerHTML = html;

  function renderOverlay() {
    var el = $('overlay');
    if (!state.connOpen) { el.hidden = true; el.innerHTML = ''; return; }

      '<div class="muted" style="font-size:19px;line-height:1.4">' + (conn ? 'Connected to the coffee cart Google Sheet.' : 'Test mode: nothing is shared yet.') +

      '<button class="secondary" style="min-height:60px;font-size:22px;padding:0 28px" data-action="closeConn">Close</button></div>' +

  function render() {

  // ---------- actions ----------
  function resetOrder() {
    state.screen = 'drink'; state.drink = null; state.step = 0; state.sel = {}; state.flavors = [];
    state.cart = []; state.name = ''; state.method = null; state.room = '';
    state.pay = null; state.teacherId = null; state.teacherQuery = ''; state.result = null; state.sendError = '';
  }
  function finishDrink() {
    var d = drinkObj();
    var lines = linesFor(state.sel, state.flavors).filter(function (l) { return l[0] !== 'Temp'; });
    state.cart.push({
      id: state.nextId++, title: (state.sel.temp ? state.sel.temp + ' ' : '') + d.name,
      detail: lines.length ? lines.map(function (l) { return l[0] + ': ' + l[1]; }).join(' · ') : 'Plain'
    });
    state.drink = null; state.step = 0; state.sel = {}; state.flavors = []; state.screen = 'review'; state.focusName = true;
  }
  function setOrderDone(id, done) {
    state.orders.forEach(function (o) { if (o.id === id) { o.done = done; o.doneAt = done ? nowMs() : null; } });
    overlay[id] = { done: done, until: 0 };
    outboxAdd({ kind: 'setDone', id: id, done: done });
    flushOutbox().then(afterPoll);
  }
  // run a teacher-PIN action on the back end, then show what happened
  function adminCall(req, okMsg) {
    req.pinHash = state.pinHash;
    api(req).then(function (r) {
      if (!r.ok) { say(r.message || 'That did not work.'); if (r.error === 'bad-pin') { state.adminUnlocked = false; state.pinHash = null; } return; }
      say(typeof okMsg === 'function' ? okMsg(r) : okMsg);
      return pollNow();
    }).catch(function () { say('Could not reach the Google Sheet. Check the connection and try again.'); }).then(render);
  }
  function say(msg) { state.adminMsg = msg; }

  var actions = {
    pickDrink: function (v) { state.drink = v; state.step = 0; state.sel = {}; state.flavors = []; state.screen = 'options'; },
    pickOption: function (v, key) { state.sel[key] = v; },
    toggleFlavor: function (v) {
      var i = state.flavors.indexOf(v);
      if (i >= 0) state.flavors.splice(i, 1); else state.flavors.push(v);
    },
    noFlavor: function () { state.flavors = []; delete state.sel.sauce; },
    pickSauce: function (v) { if (state.sel.sauce === v) delete state.sel.sauce; else state.sel.sauce = v; },
    toggleChip: function (v) {
      var chips = state.sel.chips || [];
      var i = chips.indexOf(v);
      if (i >= 0) chips.splice(i, 1); else chips.push(v);
      state.sel.chips = chips;
    },
    back: function () {
      if (state.step > 0) state.step--;
      else { state.screen = 'drink'; state.drink = null; state.sel = {}; state.flavors = []; state.step = 0; }
    },
    next: function () {
      if (!stepReady()) return;
      var d = drinkObj();
      if (state.step < d.steps.length - 1) state.step++; else finishDrink();
    },
    addAnother: function () { state.screen = 'drink'; },
    setMethod: function (v) { state.method = v; },
    toPay: function () { if (canProceed()) state.screen = 'pay'; },
    backToReview: function () { state.screen = 'review'; },
    setPay: function (v) {
      state.pay = v;
      if (v === 'punch') state.focusSearch = true;
      else { state.teacherId = null; state.teacherQuery = ''; }
    },
    pickTeacher: function (v) {
      state.teacherId = Number(v);
      var t = teacherById(state.teacherId);
      if (t && !state.name.trim()) state.name = t.name;
      state.scrollInfo = true;
    },
    removeCart: function (v) {
      state.cart = state.cart.filter(function (c) { return String(c.id) !== String(v); });
    },
    send: function () {
      if (!canSend() || state.sending) return;
      var order = {
        id: uid(), name: state.name.trim(), method: state.method, room: state.room.trim(),
        items: state.cart.map(function (c) { return { title: c.title, detail: c.detail }; }),
        pay: state.pay, teacherId: state.pay === 'punch' ? state.teacherId : null
      };
      state.sending = true; state.sendError = '';
      api({ action: 'addOrder', order: order }).then(function (r) {
        state.sending = false;
        if (!r.ok) { state.sendError = r.message || 'The order did not go through.'; return; }
        var o = r.order;
        state.result = o.pay === 'punch' ? { kind: 'punch', num: o.num, name: o.teacherName, balance: o.balanceAfter } : { kind: 'other', num: o.num };
        state.screen = 'done';
        return pollNow();
      }, function (err) {
        state.sending = false;
        if (err && err.network) { outboxAdd({ kind: 'addOrder', order: order }); state.result = { kind: 'queued' }; state.screen = 'done'; net.status = 'offline'; }
        else state.sendError = 'Something went wrong sending the order. Try again.';
      }).then(render);
    },
    newCustomer: function () { resetOrder(); },
    clearAll: function () { resetOrder(); },
    finish: function (v) { setOrderDone(v, true); },
    undo: function (v) { setOrderDone(v, false); },

    // ----- punch card admin -----
    openAdmin: function () { state.prevScreen = state.screen; state.screen = 'admin'; state.adminMsg = ''; state.adminUnlocked = false; state.changingPin = false; state.pinHash = null; },
    closeAdmin: function () { state.screen = state.prevScreen || 'drink'; state.adminUnlocked = false; state.changingPin = false; state.adminMsg = ''; state.pinHash = null; },
    lock: function () { state.adminUnlocked = false; state.adminMsg = ''; state.pinHash = null; },
    changePin: function () { state.changingPin = true; state.adminMsg = ''; },
    cancelPin: function () { state.changingPin = false; state.adminMsg = ''; },
    unlock: function () {
      var entered = val('pinInput');
      if (!entered) { say('Type the PIN first.'); return; }
      hashPin(entered).then(function (h) {
        return api({ action: 'verifyPin', pinHash: h }).then(function (r) {
          if (r.ok && r.valid) { state.pinHash = h; state.adminUnlocked = true; state.adminMsg = ''; }
          else state.adminMsg = 'That PIN is not right.';
        });
      }).catch(function () { state.adminMsg = 'Could not reach the Google Sheet. Try again.'; }).then(render);
    },
    setPin: function () {
      var a = val('pinNew'), b = val('pinConfirm');
      if (!/^\d{4,8}$/.test(a)) { say('The PIN must be 4 to 8 numbers.'); return; }
      if (a !== b) { say('The two PINs did not match. Try again.'); return; }
      hashPin(a).then(function (h) {
        return api({ action: 'setPin', pinHash: state.pinHash, newPinHash: h }).then(function (r) {
          if (!r.ok) { state.adminMsg = r.message || 'The PIN was not saved.'; return; }
          state.pinHash = h; state.changingPin = false; state.adminUnlocked = true; state.adminMsg = 'PIN saved.';
          return pollNow();
        });
      }).catch(function () { state.adminMsg = 'Could not reach the Google Sheet. Try again.'; }).then(render);
    },
    addTeacher: function () {
      var name = val('newTeacher').trim();
      var start = parseInt(val('newTeacherStart'), 10) || 0;
      if (!name) { say('Type the teacher’s name first.'); return; }
      adminCall({ action: 'addTeachers', names: [name], start: start }, function (r) { return r.added ? 'Added ' + name + '.' : name + ' is already on the list.'; });
    },
    addMany: function () {
      var names = val('bulkTeachers').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!names.length) { say('Type or paste some names first, one per line.'); return; }
      adminCall({ action: 'addTeachers', names: names, start: 0 }, function (r) {
        return 'Added ' + plural(r.added, 'teacher') + (r.skipped ? ' (' + r.skipped + ' already on the list)' : '') + '.';
      });
    },
    loadCard: function () {
      var t = teacherById(Number(val('loadTeacher')));
      var count = parseInt(val('loadCount'), 10);
      var cardNo = val('loadCardNo').trim();
      if (!t) { say('Pick a teacher first.'); return; }
      if (!(count >= 1 && count <= 50)) { say('Punches should be a number from 1 to 50.'); return; }
      adminCall({ action: 'loadCard', teacherId: t.id, count: count, cardNo: cardNo }, function (r) {
        return 'Added ' + plural(count, 'punch') + ' for ' + t.name + '. Balance: ' + r.teacher.punches + '.';
      });
    },
    adjust: function (v, key) {
      var t = teacherById(Number(v)); var delta = parseInt(key, 10);
      if (!t || !delta) return;
      adminCall({ action: 'adjust', teacherId: t.id, delta: delta }, function (r) { return t.name + ' now has ' + r.teacher.punches + '.'; });
    },
    exportBackup: function () {
      adminCall({ action: 'export' }, function (r) {
        var blob = new Blob([JSON.stringify(r.data, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        var d = new Date();
        a.href = URL.createObjectURL(blob);
        a.download = 'coffee-cart-backup-' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        return 'Backup file saved to your Downloads folder.';
      });
    },

    // ----- connection to the Google Sheet -----
    openConn: function () { state.connOpen = true; state.connMsg = ''; state.connUrl = conn ? conn.url : ''; state.connCode = conn ? conn.code : ''; state.connFocus = true; },
    closeConn: function () { state.connOpen = false; },
    testSave: function () {
      var url = state.connUrl.trim(), code = state.connCode.trim();
      if (!url || !code) { state.connMsg = 'Paste the web address and type the access code.'; return; }
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { state.connMsg = 'That does not look like an Apps Script web address. It should start with https://script.google.com/'; return; }
      state.connBusy = true; state.connMsg = '';
      remoteCall(url, code, { action: 'poll' }).then(function (r) {
        state.connBusy = false;
        if (r.ok) {
          conn = { url: url, code: code }; lsSet(CONN_KEY, conn);
          resetConnectionState();
          state.connOpen = false; state.adminUnlocked = false; state.pinHash = null;
          pollNow();
        } else state.connMsg = (r.error === 'bad-key' || r.error === 'no-key') ? 'The web address works, but the access code was not accepted.' : (r.message || 'The Sheet answered with a problem.');
      }, function () {
        state.connBusy = false;
        state.connMsg = 'Could not reach that address. Check that it was copied completely and that the web app is shared with “Anyone”.';
      }).then(render);
    },
    disconnect: function () {
      if (!window.confirm('Disconnect from the Google Sheet and go back to test mode on this device?')) return;
      conn = null; lsDel(CONN_KEY);
      resetConnectionState();
      state.connOpen = false; state.adminUnlocked = false; state.pinHash = null;
      pollNow();
    }
  };
  function resetConnectionState() {
    net.gen++; net.polling = false; net.status = 'connecting'; net.sig = ''; net.tsig = '';
    punch.teachers = []; punch.log = []; punch.hasPin = null;
    state.orders = []; overlay = {}; newUntil = {}; firstPoll = true;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = actions[el.getAttribute('data-action')];
    if (!fn) return;
    fn(el.getAttribute('data-v'), el.getAttribute('data-key'));
    render();
  });

  // typing updates state without rebuilding the page, so the cursor stays put
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'customerName') { state.name = e.target.value; var s1 = $('toPayBtn'); if (s1) s1.disabled = !canProceed(); }
    else if (id === 'roomNumber') { state.room = e.target.value; var s2 = $('toPayBtn'); if (s2) s2.disabled = !canProceed(); }
    else if (id === 'connUrl') { state.connUrl = e.target.value; }
    else if (id === 'connCode') { state.connCode = e.target.value; }
    else if (id === 'drinkNotes') { state.sel.typed = e.target.value; renderTicket(); }
    else if (id === 'teacherSearch') { state.teacherQuery = e.target.value; var tl = $('teacherList'); if (tl) tl.innerHTML = teacherListHtml(); e.target.scrollIntoView({ block: 'start' }); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'teacherSearch') {
      var m = filteredTeachers();
      e.preventDefault();
      if (m.length === 1) { actions.pickTeacher(String(m[0].id)); render(); }
      return;
    }
    var target = e.target.getAttribute && e.target.getAttribute('data-enter');
    if (target && $(target)) { e.preventDefault(); $(target).click(); }
  });

  document.addEventListener('pointerdown', function () { pointerDown = true; });
  document.addEventListener('pointerup', function () { pointerDown = false; });
  document.addEventListener('pointercancel', function () { pointerDown = false; });

  var saved = lsGet(CONN_KEY);
  if (saved && saved.url && saved.code) conn = saved;
  outbox = lsGet(OUTBOX_KEY) || [];
  render();
  pollNow();
  setInterval(pollNow, POLL_MS);
  window.addEventListener('online', pollNow);
  window.addEventListener('storage', function (e) { if (!conn && e.key === DB_KEY) pollNow(); });
  if (MODE === 'queue') setInterval(function () { if (!pointerDown && !state.connOpen) renderQueue(); }, 15000);
})();
</script>
</body>
</html>
