<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Cart Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B1D14;
    --ground: #FAF6F0;
    --line: #D9CBB8;
    --muted: #5A4A3D;
    --go: #1F6F5C;
    --pick: #FFE3A3;
    --panel: #F1E7D8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Lexend, system-ui, sans-serif; background: var(--ground); color: var(--ink); }
  button, input { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--go); outline-offset: 3px; }

  #app { display: grid; grid-template-columns: minmax(0, 1fr) clamp(230px, 23vw, 310px) clamp(250px, 24vw, 330px); height: 100vh; }
  #app > * { overflow-y: auto; }
  #main { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  #ticket { background: var(--panel); border-left: 4px solid var(--ink); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
  #queue { background: #fff; border-left: 4px solid var(--ink); padding: 28px 20px; display: flex; flex-direction: column; gap: 14px; }

  h1 { margin: 0; font-size: 42px; line-height: 1.1; font-weight: 700; }
  .side-title { font-size: 30px; font-weight: 700; }
  .muted { color: var(--muted); }

  .crumbs { display: flex; gap: 10px; }
  .crumb { flex: 1; min-width: 0; text-align: center; padding: 12px 8px; border-radius: 999px; font-size: 20px; font-weight: 600; border: 3px solid var(--line); background: #fff; color: #6B5A4C; }
  .crumb.active { border-color: var(--ink); background: var(--ink); color: #fff; }
  .crumb.done { border-color: var(--go); background: #D6EBE1; color: #12372C; }

  .drinks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .drink { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 200px; padding: 16px 10px; border-radius: 20px; border: 4px solid var(--line); background: #fff; color: var(--ink); font-size: 24px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
  .drink:hover { border-color: var(--ink); }

  .grid { display: grid; gap: 14px; }
  .tile { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 80px; padding: 12px 18px; border-radius: 18px; font-size: 23px; font-weight: 600; line-height: 1.15; text-align: left; cursor: pointer; color: var(--ink); border: 4px solid var(--line); background: #fff; }
  .tile.on { border-color: var(--ink); background: var(--pick); }
  .tile.big { min-height: 88px; font-size: 28px; }
  .tile svg { flex: none; }

  .chip { font-size: 22px; font-weight: 600; padding: 6px 16px; border-radius: 999px; background: var(--pick); border: 3px solid var(--ink); }
  .section-label { font-size: 26px; font-weight: 700; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 8px 4px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; justify-content: space-between; gap: 16px; }

  .primary, .secondary { min-height: 72px; padding: 0 40px; border-radius: 18px; font-size: 26px; cursor: pointer; }
  .primary { border: none; background: var(--go); color: #fff; font-weight: 700; }
  .primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .secondary { border: 4px solid var(--ink); background: #fff; color: var(--ink); font-weight: 600; padding: 0 36px; }
  .small { align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 600; cursor: pointer; }
  .clear { min-height: 56px; padding: 0 20px; border-radius: 14px; border: 3px solid var(--ink); background: transparent; color: var(--ink); font-size: 20px; font-weight: 600; cursor: pointer; }

  .field-label { font-size: 24px; font-weight: 600; }
  .text-input { height: 76px; width: 100%; padding: 0 24px; font-size: 34px; font-weight: 600; border-radius: 18px; border: 4px solid var(--ink); background: #fff; color: var(--ink); }
  .text-input.notes { font-size: 30px; }

  .tcard { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .t-title { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .t-detail { font-size: 20px; line-height: 1.35; }
  .making { background: var(--pick); border: 3px dashed var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .making .k { font-weight: 700; }
  .making .head { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
  .spacer { flex: 1; }

  .badge { min-width: 44px; text-align: center; padding: 6px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 24px; font-weight: 700; }
  .qcard { border: 4px solid var(--ink); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: #FFF8E6; }
  .qcard .name { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .qcard .items { font-size: 20px; line-height: 1.4; white-space: pre-line; }
  .qcard .finish { min-height: 60px; margin-top: 4px; border-radius: 14px; border: none; background: var(--go); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; }
  .fin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 20px; color: var(--muted); }

  .labels { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; flex: 1; min-height: 0; overflow-y: auto; }
  .label { width: 320px; padding: 18px 20px; border: 3px dashed var(--ink); border-radius: 14px; background: #fff; display: flex; flex-direction: column; gap: 6px; }

  /* smaller screens: keep the ticket and queue on the side, just make everything a bit tighter */
  @media (max-width: 1200px) {
    #main { padding: 20px 20px; gap: 14px; }
    #ticket { padding: 20px 14px; }
    #queue { padding: 20px 14px; }
    h1 { font-size: 34px; }
    .side-title { font-size: 26px; }
    .drinks { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .drink { min-height: 150px; font-size: 21px; }
    .drink svg { width: 64px; height: 64px; }
    .tile { font-size: 20px; padding: 10px 14px; min-height: 68px; }
    .tile.big { font-size: 24px; min-height: 76px; }
    .crumb { font-size: 16px; padding: 10px 4px; }
    .primary, .secondary { font-size: 22px; padding: 0 24px; min-height: 64px; }
    .text-input { font-size: 28px; height: 68px; }
    .qcard .name { font-size: 26px; }
    .t-title { font-size: 21px; }
    .t-detail, .qcard .items { font-size: 18px; }
    .label { width: 100%; }
  }
  /* very narrow windows only (phones): stack */
  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; height: auto; }
    #app > * { overflow-y: visible; }
    #ticket, #queue { border-left: none; border-top: 4px solid var(--ink); }
    .drinks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media print { #ticket, #queue, .crumbs, .row, .primary { display: none !important; } }
</style>
</head>
<body>
<div id="app">
  <main id="main" aria-live="polite"></main>
  <aside id="ticket" aria-label="Order ticket"></aside>
  <aside id="queue" aria-label="Order queue"></aside>
</div>

<script>
(function () {
  'use strict';

  // ---------- menu data (edit here to change the menu) ----------
  var DRINKS = [
    { id: 'mocha',     name: 'Mocha',              color: '#6B3F2A', steps: ['sauce', 'milk', 'flavor'] },
    { id: 'latte',     name: 'Latte',              color: '#B98A5E', steps: ['sauce', 'milk', 'flavor'] },
    { id: 'americano', name: 'Americano',          color: '#3B2A20', steps: ['sauce', 'flavor'] },
    { id: 'hotchoc',   name: 'Hot Chocolate',      color: '#8A4B38', steps: ['sauce', 'milk', 'flavor'] },
    { id: 'steamer',   name: 'Steamer',            color: '#E6D3B3', steps: ['sauce', 'milk', 'flavor'] },
    { id: 'lotus',     name: 'Lotus (sugar free)', color: '#E58FAE', steps: ['flavor'], sfOnly: true },
    { id: 'soda',      name: 'Italian Soda',       color: '#7FB8DA', steps: ['flavor'] },
    { id: 'tea',       name: 'Tea',                color: '#9DB86A', steps: ['tea', 'flavor'] }
  ];
  DRINKS.forEach(function (d) { d.steps = d.steps.concat('notes'); });

  var SAUCES = ['Mocha', 'Sugar Free White Mocha'];
  var MILKS = ['Regular', 'Fat Free', 'Half & Half', 'Almond', 'Oat'];
  var TEAS = ['Earl Grey', 'Decaf Earl Grey', 'Green Tea', 'English Breakfast'];
  var FLAVORS = ['Caramel', 'Hazelnut', 'Vanilla', 'Raspberry', 'Strawberry', 'Sour Gummy Worm'];
  var SF_FLAVORS = ['Raspberry', 'Strawberry', 'Vanilla'];
  var QUICK_NOTES = ['Splash of milk', 'Extra hot', 'Not too hot', 'Extra sauce'];

  var STEPS = {
    sauce:  { crumb: 'Sauce',  title: 'Pick a sauce',  hint: 'Choose one.', cols: 2, list: SAUCES },
    milk:   { crumb: 'Milk',   title: 'Pick a milk',   hint: 'Choose one.', cols: 3, list: MILKS },
    tea:    { crumb: 'Tea',    title: 'Pick a tea',    hint: 'Choose one.', cols: 2, list: TEAS },
    flavor: { crumb: 'Flavor', title: 'Add a flavor?', hint: 'Tap as many as you want, or leave it on No flavor.' },
    notes:  { crumb: 'Notes',  title: 'Any notes?',    hint: 'Optional. Tap a quick note, type your own, or just tap Add to order.' }
  };

  // ---------- state ----------
  var STORE_KEY = 'coffeeCartOrders.v1';
  var state = {
    screen: 'drink', drink: null, step: 0, sel: {}, flavors: [],
    cart: [], name: '', method: null, room: '',
    orders: [], nextNum: 1, nextId: 1
  };

  function loadSession() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && Array.isArray(saved.orders)) {
        state.orders = saved.orders;
        state.nextNum = saved.nextNum || (saved.orders.length + 1);
        state.nextId = saved.nextId || (saved.orders.length + 1);
      }
    } catch (e) { /* storage unavailable: queue just lives in memory */ }
  }
  function saveSession() {
    try {
      sessionStorage.setItem(STORE_KEY, JSON.stringify({ orders: state.orders, nextNum: state.nextNum, nextId: state.nextId }));
    } catch (e) { /* ignore */ }
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function drinkObj() { return DRINKS.filter(function (d) { return d.id === state.drink; })[0] || null; }
  function currentKey() { var d = drinkObj(); return d ? d.steps[state.step] : null; }
  function isOptionalSauce() { var d = drinkObj(); return currentKey() === 'sauce' && d.id !== 'mocha'; }

  var CHECK = '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#2B1D14"/><path d="M10 18.5l5.5 5.5L26 12.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function cup(color) {
    return '<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><path d="M16 28h40v26a16 16 0 0 1-16 16h-8a16 16 0 0 1-16-16z" fill="' + color + '" stroke="#2B1D14" stroke-width="4" stroke-linejoin="round"/><path d="M56 34h6a8 8 0 0 1 0 16h-6" fill="none" stroke="#2B1D14" stroke-width="4"/><path d="M28 8c-4 4 4 6 0 12M40 8c-4 4 4 6 0 12" fill="none" stroke="#2B1D14" stroke-width="3" stroke-linecap="round"/></svg>';
  }
  function tile(label, on, action, v, extraClass, key) {
    return '<button class="tile ' + (extraClass || '') + (on ? ' on' : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '" data-action="' + action + '" data-v="' + esc(v) + '"' + (key ? ' data-key="' + key + '"' : '') + '><span>' + esc(label) + '</span>' + (on ? CHECK : '') + '</button>';
  }

  function stepReady() {
    var d = drinkObj(); if (!d) return false;
    var key = currentKey();
    var required = (key === 'sauce' && d.id === 'mocha') || key === 'milk' || key === 'tea';
    return !required || !!state.sel[key];
  }
  function canSend() {
    return state.cart.length > 0 && state.name.trim().length > 0 && !!state.method &&
      (state.method !== 'delivery' || state.room.trim().length > 0);
  }
  function deliveryText(method, room) {
    return method === 'delivery' ? 'Delivery · Room ' + room : method === 'pickup' ? 'Pickup' : '';
  }
  function linesFor(sel, flavors) {
    var lines = [];
    if (sel.sauce && sel.sauce !== 'No sauce') lines.push(['Sauce', sel.sauce]);
    if (sel.milk) lines.push(['Milk', sel.milk]);
    if (sel.tea) lines.push(['Tea', sel.tea]);
    if (flavors.length) lines.push(['Flavor', flavors.join(', ')]);
    var notes = (sel.chips || []).concat((sel.typed || '').trim()).filter(Boolean);
    if (notes.length) lines.push(['Notes', notes.join(', ')]);
    return lines;
  }

  // ---------- rendering ----------
  function renderCrumbs() {
    var d = drinkObj();
    var labels = d ? ['Drink'].concat(d.steps.map(function (k) { return STEPS[k].crumb; }), 'Name') : ['Drink', 'Options', 'Name'];
    var active = 0;
    if (state.screen === 'options') active = state.step + 1;
    else if (state.screen === 'review') active = labels.length - 1;
    else if (state.screen === 'done') active = labels.length;
    return '<div class="crumbs">' + labels.map(function (l, i) {
      var cls = i < active ? 'done' : i === active ? 'active' : '';
      return '<div class="crumb ' + cls + '">' + (i < active ? '✓ ' : (i + 1) + '  ') + esc(l) + '</div>';
    }).join('') + '</div>';
  }

  function renderMain() {
    var html = renderCrumbs();
    var d = drinkObj();

    if (state.screen === 'drink') {
      html += '<h1>What drink is it?</h1><div class="drinks">' + DRINKS.map(function (x) {
        return '<button class="drink" data-action="pickDrink" data-v="' + x.id + '">' + cup(x.color) + '<span>' + esc(x.name) + '</span></button>';
      }).join('') + '</div>';
    }

    if (state.screen === 'options') {
      var key = currentKey(), info = STEPS[key], body = '', title = info.title, hint = info.hint;

      if (key === 'flavor') {
        var showReg = !d.sfOnly;
        var none = tile('No flavor', state.flavors.length === 0, 'noFlavor', 'none');
        var regTiles = FLAVORS.map(function (f) { return tile(f, state.flavors.indexOf(f) >= 0, 'toggleFlavor', f); });
        var sfTiles = SF_FLAVORS.map(function (f) { return tile(f, state.flavors.indexOf('Sugar Free ' + f) >= 0, 'toggleFlavor', 'Sugar Free ' + f); });
        body += '<div style="display:flex;flex-direction:column;gap:12px">';
        if (showReg) {
          body += '<div class="section-label">Flavors</div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + none + regTiles.join('') + '</div>';
          body += '<div class="section-label" style="margin-top:6px">Sugar free</div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + sfTiles.join('') + '</div>';
        } else {
          body += '<div class="section-label">Sugar free flavors</div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + none + sfTiles.join('') + '</div>';
        }
        body += '</div>';
      } else if (key === 'notes') {
        body += '<div style="display:flex;flex-direction:column;gap:14px">' +
          '<label class="section-label" for="drinkNotes">Type a note</label>' +
          '<input id="drinkNotes" class="text-input notes" type="text" autocomplete="off" placeholder="Example: just a splash of milk" value="' + esc(state.sel.typed || '') + '">' +
          '<div class="section-label" style="margin-top:6px">Quick notes</div>' +
          '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
          QUICK_NOTES.map(function (n) { return tile(n, (state.sel.chips || []).indexOf(n) >= 0, 'toggleChip', n); }).join('') +
          '</div></div>';
      } else {
        var list = info.list;
        if (isOptionalSauce()) {
          list = ['No sauce'].concat(list);
          title = 'Add a sauce?';
          hint = 'Tap one, or leave it on No sauce.';
        }
        body += '<div class="grid" style="grid-template-columns:repeat(' + info.cols + ',minmax(0,1fr))">' + list.map(function (label) {
          var on = (isOptionalSauce() && label === 'No sauce') ? (!state.sel.sauce || state.sel.sauce === 'No sauce') : state.sel[key] === label;
          return tile(label, on, 'pickOption', label, '', key);
        }).join('') + '</div>';
      }

      var last = state.step >= d.steps.length - 1;
      html += '<div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap"><h1>' + esc(title) + '</h1><div class="chip">' + esc(d.name) + '</div></div>' +
        '<div class="muted" style="font-size:22px">' + esc(hint) + '</div>' +
        '<div class="scroll">' + body + '</div>' +
        '<div class="row"><button class="secondary" data-action="back">Back</button>' +
        '<button id="nextBtn" class="primary" data-action="next"' + (stepReady() ? '' : ' disabled') + '>' + (last ? 'Add to order' : 'Next') + '</button></div>';
    }

    if (state.screen === 'review') {
      html += '<h1>Who is this order for?</h1>' +
        '<label class="field-label" for="customerName">Customer name</label>' +
        '<input id="customerName" class="text-input" type="text" autocomplete="off" placeholder="Type a name" value="' + esc(state.name) + '">' +
        '<div class="field-label">Delivery or pickup?</div>' +
        '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
        tile('Delivery', state.method === 'delivery', 'setMethod', 'delivery', 'big') +
        tile('Pickup', state.method === 'pickup', 'setMethod', 'pickup', 'big') + '</div>';
      if (state.method === 'delivery') {
        html += '<label class="field-label" for="roomNumber">Room number</label>' +
          '<input id="roomNumber" class="text-input" type="text" autocomplete="off" placeholder="Type the room number" value="' + esc(state.room) + '">';
      }
      html += '<div class="muted" style="font-size:20px;line-height:1.4">Check the ticket on the right. Tap Remove to take a drink off.</div>' +
        '<div class="spacer"></div>' +
        '<div class="row"><button class="secondary" data-action="addAnother">+ Add another drink</button>' +
        '<button id="sendBtn" class="primary" data-action="send"' + (canSend() ? '' : ' disabled') + '>Send order</button></div>';
    }

    if (state.screen === 'done') {
      var where = deliveryText(state.method, state.room.trim());
      html += '<div style="display:flex;align-items:center;gap:16px"><svg width="56" height="56" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#1F6F5C"/><path d="M10 18.5l5.5 5.5L26 12.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Order sent!</h1></div>' +
        '<div class="muted" style="font-size:22px">Cup labels (this is what we could print later)</div>' +
        '<div class="labels">' + state.cart.map(function (c) {
          return '<div class="label"><div style="font-size:36px;font-weight:700;line-height:1.1">' + esc(state.name.trim()) + '</div>' +
            '<div style="font-size:22px;font-weight:700">' + esc(where) + '</div>' +
            '<div style="font-size:26px;font-weight:600">' + esc(c.title) + '</div>' +
            '<div style="font-size:20px;line-height:1.35">' + esc(c.detail) + '</div></div>';
        }).join('') + '</div>' +
        '<div style="display:flex;justify-content:flex-end"><button class="primary" data-action="newCustomer">Next customer</button></div>';
    }

    $('main').innerHTML = html;
    if (state.screen === 'review' && !state.name) { var n = $('customerName'); if (n) n.focus(); }
  }

  function renderTicket() {
    var d = drinkObj();
    var hasCurrent = state.screen === 'options' && d;
    var html = '<div class="side-title">Order ticket</div>';
    if (!state.cart.length && !hasCurrent) html += '<div class="muted" style="font-size:22px;line-height:1.4">Nothing yet. Tap a drink to start.</div>';
    html += state.cart.map(function (c) {
      return '<div class="tcard"><div class="t-title">' + esc(c.title) + '</div><div class="t-detail">' + esc(c.detail) + '</div>' +
        (state.screen !== 'done' ? '<button class="small" data-action="removeCart" data-v="' + c.id + '" aria-label="Remove ' + esc(c.title) + '">Remove</button>' : '') + '</div>';
    }).join('');
    if (hasCurrent) {
      var lines = [['Drink', d.name]].concat(linesFor(state.sel, state.flavors));
      html += '<div class="making"><div class="head">NOW MAKING</div>' + lines.map(function (l) {
        return '<div style="font-size:21px;line-height:1.3"><span class="k">' + esc(l[0]) + ':</span> ' + esc(l[1]) + '</div>';
      }).join('') + '</div>';
    }
    html += '<div class="spacer"></div>';
    if (state.screen !== 'done' && (state.cart.length || d)) html += '<button class="clear" data-action="clearAll">Clear order</button>';
    $('ticket').innerHTML = html;
  }

  function renderQueue() {
    var open = state.orders.filter(function (o) { return !o.done; });
    var fin = state.orders.filter(function (o) { return o.done; }).slice(-3).reverse();
    var html = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="side-title">Queue</div><div class="badge">' + open.length + '</div></div>';
    if (!open.length) html += '<div class="muted" style="font-size:22px;line-height:1.4">No orders waiting.</div>';
    html += open.map(function (o) {
      return '<div class="qcard"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div class="name">' + esc(o.name) + '</div><div style="font-size:22px;font-weight:700">#' + o.num + '</div></div>' +
        '<div style="font-size:22px;font-weight:700">' + esc(deliveryText(o.method, o.room)) + '</div>' +
        '<div class="muted" style="font-size:18px">Sent ' + esc(o.time) + '</div>' +
        '<div class="items">' + o.items.map(function (i) { return esc(i.title + ' — ' + i.detail); }).join('\n') + '</div>' +
        '<button class="finish" data-action="finish" data-v="' + o.id + '">Mark finished</button></div>';
    }).join('');
    if (fin.length) {
      html += '<div style="font-size:20px;font-weight:700;margin-top:8px;padding-top:12px;border-top:3px solid var(--line)">Finished</div>' + fin.map(function (o) {
        return '<div class="fin-row"><span><b>' + esc(o.name) + '</b> #' + o.num + '</span><button class="small" data-action="undo" data-v="' + o.id + '" aria-label="Move ' + esc(o.name) + ' back to the queue">Undo</button></div>';
      }).join('');
    }
    $('queue').innerHTML = html;
  }

  function render() { renderMain(); renderTicket(); renderQueue(); }

  // ---------- actions ----------
  function resetOrder() {
    state.screen = 'drink'; state.drink = null; state.step = 0; state.sel = {}; state.flavors = [];
    state.cart = []; state.name = ''; state.method = null; state.room = '';
  }
  function finishDrink() {
    var d = drinkObj();
    var lines = linesFor(state.sel, state.flavors);
    state.cart.push({
      id: state.nextId++, title: d.name,
      detail: lines.length ? lines.map(function (l) { return l[0] + ': ' + l[1]; }).join(' · ') : 'Plain'
    });
    state.drink = null; state.step = 0; state.sel = {}; state.flavors = []; state.screen = 'review';
  }
  function setOrderDone(id, done) {
    state.orders.forEach(function (o) { if (String(o.id) === String(id)) o.done = done; });
    saveSession();
  }

  var actions = {
    pickDrink: function (v) { state.drink = v; state.step = 0; state.sel = {}; state.flavors = []; state.screen = 'options'; },
    pickOption: function (v, key) { state.sel[key] = v; },
    toggleFlavor: function (v) {
      var i = state.flavors.indexOf(v);
      if (i >= 0) state.flavors.splice(i, 1); else state.flavors.push(v);
    },
    noFlavor: function () { state.flavors = []; },
    toggleChip: function (v) {
      var chips = state.sel.chips || [];
      var i = chips.indexOf(v);
      if (i >= 0) chips.splice(i, 1); else chips.push(v);
      state.sel.chips = chips;
    },
    back: function () {
      if (state.step > 0) state.step--;
      else { state.screen = 'drink'; state.drink = null; state.sel = {}; state.flavors = []; state.step = 0; }
    },
    next: function () {
      if (!stepReady()) return;
      var d = drinkObj();
      if (state.step < d.steps.length - 1) state.step++; else finishDrink();
    },
    addAnother: function () { state.screen = 'drink'; },
    setMethod: function (v) { state.method = v; },
    removeCart: function (v) {
      state.cart = state.cart.filter(function (c) { return String(c.id) !== String(v); });
    },
    send: function () {
      if (!canSend()) return;
      state.orders.push({
        id: state.nextId++, num: state.nextNum++, name: state.name.trim(),
        method: state.method, room: state.room.trim(),
        time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
        done: false,
        items: state.cart.map(function (c) { return { title: c.title, detail: c.detail }; })
      });
      state.screen = 'done';
      saveSession();
    },
    newCustomer: function () { resetOrder(); },
    clearAll: function () { resetOrder(); },
    finish: function (v) { setOrderDone(v, true); },
    undo: function (v) { setOrderDone(v, false); }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = actions[el.getAttribute('data-action')];
    if (!fn) return;
    fn(el.getAttribute('data-v'), el.getAttribute('data-key'));
    render();
  });

  // typing updates state without rebuilding the page, so the cursor stays put
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'customerName') { state.name = e.target.value; var s1 = $('sendBtn'); if (s1) s1.disabled = !canSend(); }
    else if (id === 'roomNumber') { state.room = e.target.value; var s2 = $('sendBtn'); if (s2) s2.disabled = !canSend(); }
    else if (id === 'drinkNotes') { state.sel.typed = e.target.value; renderTicket(); }
  });

  loadSession();
  render();
})();
</script>
</body>
</html>
