<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#10242b; --fg:#ffffff; --accent:#ffc857; --btn:#1d3d48; --btn-h:#2a5666; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font-family:'Lexend',system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; }
  #app { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; min-width:0; transition:background .3s; }
  #app.done { animation:flash 1s steps(2) infinite; }
  @keyframes flash { 0%{background:#10242b;} 50%{background:#b3261e;} }
  #display { font-size:clamp(56px,22vw,200px); font-weight:700; letter-spacing:.02em; font-variant-numeric:tabular-nums; line-height:1; }
  #message { font-size:clamp(18px,5vw,40px); font-weight:600; color:var(--accent); text-align:center; min-height:1.3em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button { font:inherit; font-weight:600; color:var(--fg); background:var(--btn); border:2px solid var(--fg); border-radius:12px; padding:10px 18px; cursor:pointer; font-size:clamp(14px,3.5vw,20px); }
  button:hover { background:var(--btn-h); }
  button.primary { background:var(--accent); color:#10242b; border-color:var(--accent); }
  button.active { outline:3px solid var(--accent); }
  input[type=text], input[type=number] { font:inherit; font-size:16px; padding:8px 10px; border-radius:8px; border:2px solid var(--fg); background:#0b1a1f; color:var(--fg); }
  input[type=number] { width:5.5em; }
  select { font:inherit; font-size:16px; padding:8px 10px; border-radius:8px; border:2px solid var(--fg); background:#0b1a1f; color:var(--fg); }
  input[type=text] { width:min(360px,80vw); }
  label { font-size:14px; opacity:.85; }
  #settings { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .small { font-size:13px; padding:6px 12px; }
  .compact #quick, .compact #settings { display:none; }
  .compact button { font-size:13px; padding:6px 12px; border-radius:10px; border-width:2px; }
  html:has(.compact), body:has(.compact) { overflow:hidden; }
  #app.compact { gap:6px; padding:6px; min-width:0; min-height:0; overflow:hidden; }
  .compact #display { font-size:min(30vw, 55vh); }
  .compact #message { font-size:min(7vw, 11vh); min-height:0; }
  .compact #message:empty { display:none; }
  /* Shrink the window enough and extras drop away, leaving only the time */
  @media (max-height:170px) { .compact .row { display:none; } }
  @media (max-height:110px) { .compact #message { display:none; } }
</style>
</head>
<body>
<div id="app">
  <div id="display">05:00</div>
  <div id="message"></div>
  <div class="row" id="quick">
    <button data-min="2">2 min</button>
    <button data-min="5" class="active">5 min</button>
    <button data-min="10">10 min</button>
  </div>
  <div class="row">
    <button id="start" class="primary">Start</button>
    <button id="reset">Reset</button>
  </div>
  <div id="settings">
    <div class="row">
      <label for="custom">Custom (min):</label>
      <input type="number" id="custom" min="0.5" step="0.5" placeholder="e.g. 7">
      <button id="setCustom" class="small">Set</button>
    </div>
    <div class="row">
      <label for="msg">When time's up, show:</label>
      <input type="text" id="msg" value="Time's up! Clean up and line up.">
    </div>
    <div class="row">
      <label for="showMode">Show message:</label>
      <select id="showMode">
        <option value="always">All the time</option>
        <option value="end" selected>Only when time's up</option>
      </select>
    </div>
    <div class="row">
      <button id="popout" class="small">Pop out ⧉</button>
    </div>
  </div>
</div>

<script>
(function(){
  // Cache elements up front: once they move into the pop-out window, document.getElementById can't find them.
  const els = {};
  document.querySelectorAll('[id]').forEach(e => els[e.id] = e);
  const $ = id => els[id];
  const app = $('app'), display = $('display'), message = $('message');
  let total = 300, remaining = 300, endAt = null, tick = null;

  function fmt(s){ s = Math.max(0, Math.ceil(s)); const m = Math.floor(s/60), r = s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
  function render(){ display.textContent = fmt(remaining); document.title = (endAt ? fmt(remaining)+' – ' : '') + 'Classroom Timer'; }
  function beep(){
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      [0,.4,.8].forEach(t=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.3,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.3); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.3); });
    } catch(e){}
  }
  function stop(){ clearInterval(tick); tick = null; endAt = null; $('start').textContent = 'Start'; }
  function updateMessage(){
    const done = app.classList.contains('done');
    message.textContent = (done || $('showMode').value === 'always') ? $('msg').value : '';
  }
  function finish(){ stop(); remaining = 0; render(); app.classList.add('done'); updateMessage(); beep(); }
  function setTime(sec){ stop(); total = remaining = sec; app.classList.remove('done'); updateMessage(); render(); }

  function start(){
    if (tick){ // pause
      remaining = (endAt - Date.now())/1000; stop(); render(); $('start').textContent = 'Resume'; return;
    }
    if (remaining <= 0) remaining = total;
    app.classList.remove('done'); updateMessage();
    endAt = Date.now() + remaining*1000;
    $('start').textContent = 'Pause';
    tick = setInterval(()=>{ remaining = (endAt - Date.now())/1000; if (remaining <= 0) finish(); else render(); }, 200);
    render();
  }

  $('start').onclick = start;
  $('reset').onclick = () => setTime(total);
  document.querySelectorAll('#quick button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#quick button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); setTime(+b.dataset.min*60);
  });
  $('setCustom').onclick = () => {
    const v = parseFloat($('custom').value);
    if (v > 0){ document.querySelectorAll('#quick button').forEach(x=>x.classList.remove('active')); setTime(Math.round(v*60)); }
  };
  $('custom').addEventListener('keydown', e => { if (e.key==='Enter') $('setCustom').click(); });
  $('msg').addEventListener('input', updateMessage);
  $('showMode').addEventListener('change', updateMessage);

  // Pop out: always-on-top Picture-in-Picture window where supported, else a small window.
  $('popout').onclick = async () => {
    if (window.documentPictureInPicture) {
      try {
        const pip = await documentPictureInPicture.requestWindow({ width: 340, height: 260 });
        [...document.styleSheets].forEach(ss => {
          if (ss.href) { const l = pip.document.createElement('link'); l.rel='stylesheet'; l.href=ss.href; pip.document.head.appendChild(l); }
          else { const st = pip.document.createElement('style'); st.textContent=[...ss.cssRules].map(r=>r.cssText).join('\n'); pip.document.head.appendChild(st); }
        });
        pip.document.body.style.cssText = 'margin:0;display:flex;height:100vh;background:#10242b;';
        pip.document.body.appendChild(app);
        app.classList.add('compact');
        pip.addEventListener('pagehide', () => { document.body.appendChild(app); app.classList.remove('compact'); });
        return;
      } catch(e){}
    }
    const p = new URLSearchParams({ compact:'1', msg:$('msg').value, mode:$('showMode').value, sec:Math.max(1, Math.round(remaining)) });
    window.open(location.pathname + '?' + p.toString(), 'timerpop', 'popup=yes,width=340,height=280');
  };

  const q = new URLSearchParams(location.search);
  if (q.get('compact')) {
    app.classList.add('compact');
    if (q.get('msg') !== null) $('msg').value = q.get('msg');
    if (q.get('mode')) $('showMode').value = q.get('mode');
    if (+q.get('sec') > 0) setTime(+q.get('sec'));
  }
  updateMessage();
  render();
})();
</script>
</body>
</html>
