<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Random Picker</title>
<style>
  * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; min-height: 100vh; background: #121212; color: #F1EFE8; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .setup-box { max-width: 480px; margin: 24px auto; padding: 0 16px; }
  .setup-card { background: #1E1E1E; border: 1.5px solid #3A3A3A; border-radius: 12px; padding: 18px; text-align: left; }
  .setup-card p { color: #D7D5CE; font-size: 13px; }
  .setup-card input { width: 100%; border: 1.5px solid #3A3A3A; border-radius: 8px; padding: 10px 12px; font-size: 13px; background: #121212; color: #F1EFE8; font-family: sans-serif; margin-top: 8px; }
  .setup-card button { width: 100%; background: #185FA5; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; color: #ffffff; cursor: pointer; margin-top: 10px; }

  .top-bar { position: fixed; top: 0; left: 0; right: 0; padding: 14px 20px; text-align: center; }
  .top-bar h1 { margin: 0; font-size: 16px; font-weight: 600; color: #9A9890; letter-spacing: 0.04em; text-transform: uppercase; }
  #class-name { margin: 2px 0 0; font-size: 14px; color: #D7D5CE; }

  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #3A3A3A; border-top-color: #185FA5; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading h2 { margin: 0 0 8px; color: #F1EFE8; }
  .loading p { margin: 0; color: #9A9890; font-size: 14px; }

  #stage { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 900px; padding: 0 20px; }
  #status-line { font-size: 16px; color: #9A9890; margin-bottom: 18px; min-height: 22px; }
  #name-display { font-size: clamp(48px, 10vw, 110px); font-weight: 800; color: #F1EFE8; line-height: 1.1; min-height: 1.2em; transition: color 0.2s; }
  #name-display.landed { color: #4ADE80; }
  #hint { font-size: 14px; color: #6B6963; margin-top: 10px; min-height: 18px; }

  .controls { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 12px; justify-content: center; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.5), transparent); }
  .btn { border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: all 0.1s; }
  .btn:active { transform: scale(0.96); }
  .btn-pick { background: #185FA5; color: #ffffff; font-size: 22px; padding: 18px 44px; }
  .btn-pick:disabled { background: #2A3F52; color: #6B7B8C; cursor: default; }
  .btn-reset { background: transparent; color: #9A9890; border: 1.5px solid #3A3A3A; font-size: 14px; padding: 18px 20px; }

  .mode-tabs { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .mode-tab { background: transparent; border: 1.5px solid #3A3A3A; color: #9A9890; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .mode-tab.active { background: #185FA5; border-color: #185FA5; color: #ffffff; }

  #groups-stage { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 900px; padding: 0 20px; }
  #groups-status-line { font-size: 16px; color: #9A9890; margin-bottom: 18px; min-height: 22px; }
  #groups-display { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 16px; width: 100%; }
  .group-card { background: #1E1E1E; border: 1.5px solid #3A3A3A; border-radius: 12px; padding: 14px; text-align: left; }
  .group-card-title { font-size: 13px; font-weight: 700; color: #9A9890; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .group-card-names { font-size: 19px; font-weight: 600; color: #F1EFE8; line-height: 1.5; }
  .group-card-empty { color: #6B6963; font-size: 14px; font-weight: 400; }

  #group-count-input { width: 60px; border: 1.5px solid #3A3A3A; border-radius: 8px; padding: 10px; font-size: 16px; text-align: center; background: #121212; color: #F1EFE8; }
  .groups-label { color: #D7D5CE; font-size: 14px; align-self: center; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Random Picker</h1>
  <p id="class-name">Connecting...</p>
  <div class="mode-tabs" id="mode-tabs" style="display:none;">
    <button class="mode-tab active" id="tab-name" onclick="setMode('name')">Pick a Name</button>
    <button class="mode-tab" id="tab-groups" onclick="setMode('groups')">Make Groups</button>
  </div>
</div>

<div id="setup-screen" class="setup-box" style="display:none;">
  <div class="setup-card">
    <p style="font-size:14px;font-weight:700;color:#F1EFE8;margin-bottom:6px;">Connect to your Sheet</p>
    <p>Paste the same Sheet ID (or URL) your Classroom Tracker uses.</p>
    <input type="text" id="picker-sheet-input" placeholder="Sheet ID or URL..." />
    <button onclick="savePickerSheetId()">Connect</button>
    <p id="picker-setup-status" style="font-size:12px;color:#9A9890;margin-top:8px;"></p>
  </div>
</div>

<div id="loading-state" class="loading" style="display:none;">
  <div class="spinner"></div>
  <h2>Waiting for a class</h2>
  <p>Set which class is active on the kiosk screen from Classroom Tracker.</p>
</div>

<div id="stage">
  <div id="status-line">&nbsp;</div>
  <div id="name-display">&nbsp;</div>
  <div id="hint">&nbsp;</div>
</div>

<div id="groups-stage">
  <div id="groups-status-line">&nbsp;</div>
  <div id="groups-display"></div>
</div>

<div class="controls" id="name-controls" style="display:none;">
  <button class="btn btn-reset" onclick="resetPicker()">Reset round</button>
  <button class="btn btn-pick" id="pick-btn" onclick="drawPickerName()">&#127922; Pick a name</button>
</div>

<div class="controls" id="groups-controls" style="display:none;">
  <label class="groups-label">Groups:</label>
  <input type="number" id="group-count-input" min="2" max="20" value="4" />
  <button class="btn btn-pick" onclick="generateGroups()">&#127922; Make Groups</button>
</div>

<script>
// ============================================================
// SERVICE ACCOUNT CONFIG - must match teacher file
// ============================================================
var SA_EMAIL = 'classroom-tracker@classroom-tracker-499621.iam.gserviceaccount.com';
var SHEET_PASSES = 'passes';
var SHEET_CONFIG = 'config';

// ============================================================
// SHEETS RELAY
// ============================================================
var RELAY_URL = 'https://classroom-tools-relay.vtewksbury.workers.dev/';
var RELAY_CLIENT_KEY = '65f0d9015473b68471cc9426e42a029a008d88d68144a9e5';

var cachedToken = null;
var tokenExpiry = 0;

async function getAccessToken() {
  if (cachedToken && Date.now() < tokenExpiry - 60000) return cachedToken;
  var resp = await fetch(RELAY_URL, { headers: { 'X-Relay-Key': RELAY_CLIENT_KEY } });
  var data = await resp.json();
  if (data.error) throw new Error('Relay error: ' + data.error);
  cachedToken = data.access_token;
  tokenExpiry = Date.now() + (data.expires_in||3600)*1000;
  return cachedToken;
}

// ============================================================
// SHEETS API (read-only -- this display never writes anything back)
// ============================================================
var SHEET_ID = '';

async function sheetsGet(range) {
  var token = await getAccessToken();
  var r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent(range),
    {headers:{'Authorization':'Bearer '+token}});
  return r.json();
}

// ============================================================
// STATE
// ============================================================
var activeClassId = null;
var activeClassName = '';
var students = [];
var todayTrips = {};         // name -> [{type,out,back}, ...] for today
var pollInterval = null;
var pickerPicked = {};       // pickerPicked[classId][dateKey] = [names already drawn this round]
var drawing = false;
var mode = 'name';           // 'name' or 'groups' -- which half of the tool is showing

function todayKey(){ return new Date().toISOString().slice(0,10); }

// ============================================================
// SHEET ID SETUP (first time only; separate from the Tracker's
// and the Pass Kiosk's own saved Sheet ID -- this is its own tab/device)
// ============================================================
function savePickerSheetId() {
  var inp = document.getElementById('picker-sheet-input');
  var id = inp.value.trim();
  var match = id.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) id = match[1];
  if (!id) { alert('Please paste the Sheet ID or URL.'); return; }

  var status = document.getElementById('picker-setup-status');
  status.textContent = 'Connecting...';
  SHEET_ID = id;

  getAccessToken().then(function(){
    return sheetsGet(SHEET_CONFIG+'!A1:B1');
  }).then(function(){
    localStorage.setItem('picker_sheet_id', id);
    status.textContent = 'Connected!';
    document.getElementById('setup-screen').style.display = 'none';
    startPolling();
  }).catch(function(e){
    status.textContent = 'Connection failed: '+e.message+'. Check the Sheet ID and that it has been shared with the service account.';
    SHEET_ID = '';
  });
}

// ============================================================
// POLLING -- reads only; this page never writes to the Sheet.
// Mirrors config!kioskClassId / rosterData, the same keys the
// Tracker already maintains for the Pass Kiosk screen, so the
// Picker follows whichever class the teacher has already flagged
// active there (no extra step for her).
// ============================================================
function startPolling() {
  poll();
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(poll, 5000);
}

function poll() {
  if (!SHEET_ID || drawing) return;
  sheetsGet(SHEET_CONFIG+'!A1:B10').then(function(res) {
    var rows = res.values || [];
    var cfg = {};
    rows.forEach(function(r){ if(r[0]) cfg[r[0]]=r[1]||''; });

    var newClassId = cfg['kioskClassId']||'';
    var rosterData = {};
    try { rosterData = JSON.parse(cfg['rosterData']||'{}'); } catch(e){}

    if (!newClassId || !rosterData[newClassId] || !rosterData[newClassId].students || !rosterData[newClassId].students.length) {
      showWaiting();
      return;
    }

    var classInfo = rosterData[newClassId];
    var classChanged = newClassId !== activeClassId;
    activeClassId = newClassId;
    students = classInfo.students.slice();
    activeClassName = classInfo.name || 'Current Class';
    document.getElementById('class-name').textContent = activeClassName;
    if (classChanged) {
      var nd = document.getElementById('name-display');
      nd.textContent = ' '; nd.classList.remove('landed');
      document.getElementById('hint').textContent = ' ';
      document.getElementById('groups-status-line').textContent = ' ';
      document.getElementById('groups-display').innerHTML = '';
    }

    readTodayTrips();
  }).catch(function(e){ console.log('poll error', e); });
}

function readTodayTrips() {
  var today = todayKey();
  sheetsGet(SHEET_PASSES+'!A2:J5000').then(function(res) {
    var rows = res.values || [];
    var trips = {};
    students.forEach(function(n){ trips[n] = []; });

    rows.forEach(function(r) {
      var classId=r[2], name=r[4], type=r[5], out=parseInt(r[7])||0, back=parseInt(r[8])||0;
      if (classId !== activeClassId || !name || !type || trips[name] === undefined) return;
      var dk = out ? new Date(out).toISOString().slice(0,10) : '';
      if (dk !== today) return;
      trips[name].push({ type: type, out: out, back: back || null });
    });

    todayTrips = trips;
    showStage();
    renderStatus();
  }).catch(function(e){ console.log('readTodayTrips error', e); });
}

// ============================================================
// STATUS -- exact mirror of Classroom Tracker's getStudentStatus()
// present check, just computed from polled Sheet rows instead of
// local passData, so "Present" means the same thing in both places.
// ============================================================
function isPresent(name) {
  var trips = todayTrips[name] || [];
  if (trips.some(function(t){ return t.type === 'absent'; })) return false;
  if (trips.some(function(t){ return t.type === 'tardy' && !t.back; })) return false;
  var active = trips.find(function(t){ return ['absent','tardy','note','clockin'].indexOf(t.type) === -1 && !t.back; });
  if (!active) {
    return trips.some(function(t){ return t.type === 'clockin'; });
  }
  return false; // currently out on a pass (bathroom/water/other/alert)
}

function presentStudents() {
  return students.filter(isPresent);
}

function pickerPool() {
  var t = todayKey();
  if (!pickerPicked[activeClassId]) pickerPicked[activeClassId] = {};
  if (!pickerPicked[activeClassId][t]) pickerPicked[activeClassId][t] = [];
  var picked = pickerPicked[activeClassId][t];
  var present = presentStudents();
  var remaining = present.filter(function(n){ return picked.indexOf(n) === -1; });
  return { present: present, picked: picked, remaining: remaining };
}

// ============================================================
// UI
// ============================================================
function showWaiting() {
  document.getElementById('loading-state').style.display = 'flex';
  document.getElementById('stage').style.display = 'none';
  document.getElementById('groups-stage').style.display = 'none';
  document.getElementById('name-controls').style.display = 'none';
  document.getElementById('groups-controls').style.display = 'none';
  document.getElementById('mode-tabs').style.display = 'none';
  document.getElementById('class-name').textContent = 'Waiting for teacher...';
  activeClassId = null;
}

function showStage() {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('mode-tabs').style.display = 'flex';
  setMode(mode);
}

function setMode(m) {
  mode = m;
  document.getElementById('tab-name').classList.toggle('active', m === 'name');
  document.getElementById('tab-groups').classList.toggle('active', m === 'groups');
  document.getElementById('stage').style.display = m === 'name' ? 'flex' : 'none';
  document.getElementById('groups-stage').style.display = m === 'groups' ? 'flex' : 'none';
  document.getElementById('name-controls').style.display = m === 'name' ? 'flex' : 'none';
  document.getElementById('groups-controls').style.display = m === 'groups' ? 'flex' : 'none';
}

function renderStatus() {
  var el = document.getElementById('status-line'); if (!el) return;
  var pool = pickerPool();
  var pickBtn = document.getElementById('pick-btn');
  if (!pool.present.length) {
    el.textContent = 'No students marked Present yet';
    if (pickBtn) pickBtn.disabled = true;
    return;
  }
  if (pickBtn) pickBtn.disabled = false;
  el.textContent = pool.remaining.length + ' of ' + pool.present.length + ' present student' + (pool.present.length !== 1 ? 's' : '') + ' left this round';
}

function drawPickerName() {
  if (drawing || !activeClassId) return;
  var pool = pickerPool();
  if (!pool.present.length) return;
  var remaining = pool.remaining;
  var reshuffled = false;
  if (!remaining.length) {
    pickerPicked[activeClassId][todayKey()] = [];
    remaining = pool.present.slice();
    reshuffled = true;
  }
  var finalName = remaining[Math.floor(Math.random()*remaining.length)];

  drawing = true;
  document.getElementById('pick-btn').disabled = true;
  var nd = document.getElementById('name-display');
  var hint = document.getElementById('hint');
  nd.classList.remove('landed');
  hint.textContent = reshuffled ? 'Everyone’s had a turn — starting a new round…' : ' ';

  var pool2 = pool.present.length ? pool.present : [finalName];
  var ticks = 14;
  var i = 0;
  var shuffle = setInterval(function(){
    nd.textContent = pool2[Math.floor(Math.random()*pool2.length)];
    i++;
    if (i >= ticks) {
      clearInterval(shuffle);
      nd.textContent = finalName;
      nd.classList.add('landed');
      hint.textContent = ' ';
      pickerPicked[activeClassId][todayKey()].push(finalName);
      drawing = false;
      renderStatus();
    }
  }, 90);
}

function resetPicker() {
  if (!activeClassId || drawing) return;
  if (!pickerPicked[activeClassId]) pickerPicked[activeClassId] = {};
  pickerPicked[activeClassId][todayKey()] = [];
  var nd = document.getElementById('name-display');
  nd.textContent = ' '; nd.classList.remove('landed');
  document.getElementById('hint').textContent = ' ';
  renderStatus();
}

// ============================================================
// RANDOM GROUPS -- same present-student pool as the name picker,
// split as evenly as possible across however many groups the teacher
// asks for. Nothing here writes to the Sheet; purely a display action.
// ============================================================
function shuffledPresentStudents() {
  var arr = presentStudents().slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function makeGroups(arr, n) {
  var groups = [];
  for (var i = 0; i < n; i++) groups.push([]);
  arr.forEach(function(name, i){ groups[i % n].push(name); });
  return groups;
}
function renderGroups(groups) {
  var el = document.getElementById('groups-display'); if (!el) return;
  el.innerHTML = groups.map(function(g, i) {
    var names = g.length ? g.join('<br>') : '<span class="group-card-empty">(empty)</span>';
    return '<div class="group-card"><div class="group-card-title">Group ' + (i + 1) + '</div><div class="group-card-names">' + names + '</div></div>';
  }).join('');
}
function generateGroups() {
  if (!activeClassId) return;
  var inp = document.getElementById('group-count-input');
  var n = parseInt(inp.value, 10);
  var statusEl = document.getElementById('groups-status-line');
  if (!n || n < 2) { statusEl.textContent = 'Enter a number of groups (2 or more).'; return; }
  var present = presentStudents();
  if (!present.length) { statusEl.textContent = 'No students marked Present yet'; renderGroups([]); return; }
  if (n > present.length) { statusEl.textContent = 'Only ' + present.length + ' student' + (present.length !== 1 ? 's are' : ' is') + ' present \u2014 try a smaller number.'; return; }
  var groups = makeGroups(shuffledPresentStudents(), n);
  statusEl.textContent = present.length + ' present student' + (present.length !== 1 ? 's' : '') + ' split into ' + n + ' groups';
  renderGroups(groups);
}

// ============================================================
// INIT
// ============================================================
function init() {
  var savedSheet = localStorage.getItem('picker_sheet_id');
  if (savedSheet) {
    SHEET_ID = savedSheet;
    document.getElementById('setup-screen').style.display = 'none';
    startPolling();
  } else {
    document.getElementById('setup-screen').style.display = 'block';
  }
}
init();
</script>
</body>
</html>
